name: DPRO ESTATE NEXT-10 Hotfix Followup Auth R2

'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/estate-next-10-followup-auth-r2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-estate-next-10-followup-auth-r2
  cancel-in-progress: false

jobs:
  followup-auth-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: main
      WORKFLOW_PATH: .github/workflows/estate-next-10-followup-auth-r2.yml
      PAGE_BASE: https://dpromstk2000-lab.github.io/dpro-estate-line-liff
      NEXT_API_BASE: https://dpro-estate-next4-api.dpromstk2000.workers.dev
      SHOP_CODE: dpro_estate_demo
      ADMIN_CODE_SECRET: ${{ secrets.DPRO_ESTATE_ADMIN_CODE }}
      BACKUP_TAG: dpro-estate-next-10-followup-auth-before-20260725

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify completed system and protect current version
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dpro-next/estate-progress.yml
          test "$(awk -F': ' '/^current_step:/{print $2;exit}' dpro-next/estate-progress.yml)" = 'ESTATE-NEXT-COMPLETE'
          test "$(awk -F': ' '/^complete:/{print $2;exit}' dpro-next/estate-progress.yml)" = 'true'
          test -s followup.html
          test -s followup-api.js
          test -s config.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git rev-parse "$BACKUP_TAG^{commit}" >/dev/null 2>&1; then
            tag_commit="$(git rev-parse "$BACKUP_TAG^{commit}")"
            if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
              echo 'ERROR: existing backup tag is not an ancestor of main.'
              exit 1
            fi
            echo "Reusing backup tag: $BACKUP_TAG -> $tag_commit"
          else
            base_commit="$(git rev-parse HEAD^)"
            git tag -a "$BACKUP_TAG" "$base_commit" -m 'DPRO ESTATE completed version before followup authentication hotfix'
            git push origin "$BACKUP_TAG"
          fi

      - name: Guard exact defect before patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_GUARD'
          from pathlib import Path
          text = Path('followup.html').read_text(encoding='utf-8')
          old = "await legacy('/api/admin/login');"
          if text.count(old) != 1:
              raise SystemExit(f'ERROR: expected exactly one legacy login call, found {text.count(old)}')
          required = [
              "API.listTasks",
              "API.listRevisits",
              "legacy('/api/admin/customers'",
              "id=\"panel-today\"",
              "id=\"panel-revisit\"",
              "id=\"panel-proposal\"",
              "id=\"panel-exclusion\"",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: existing followup features are missing: {missing}')
          print('Exact followup authentication defect confirmed.')
          PY_GUARD

      - name: Replace nonexistent login endpoint with read-only authentication
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path

          path = Path('followup.html')
          text = path.read_text(encoding='utf-8')

          old = "await legacy('/api/admin/login');"
          new = "await API.listTasks(state.adminCode,{status:'open',limit:1});"
          if text.count(old) != 1:
              raise SystemExit('ERROR: login call replacement target is not unique.')
          text = text.replace(old, new, 1)

          marker = '<!-- ESTATE-NEXT-10-HOTFIX-FOLLOWUP-AUTH-R2 / 20260725 -->'
          if marker not in text:
              text = text.replace('<body>', '<body>\\n  ' + marker, 1)

          text = text.replace(
              'config.js?v=estate-next-8',
              'config.js?v=estate-next-10-followup-auth-r2'
          )
          text = text.replace(
              'followup-api.js?v=estate-next-8',
              'followup-api.js?v=estate-next-10-followup-auth-r2'
          )
          text = text.replace(
              'owner.html?v=estate-next-8',
              'owner.html?v=estate-next-10-followup-auth-r2'
          )

          path.write_text(text, encoding='utf-8')
          print('followup.html authentication hotfix installed.')
          PY_PATCH

      - name: Validate HTML JavaScript IDs security and existing features
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -q 'ESTATE-NEXT-10-HOTFIX-FOLLOWUP-AUTH-R2' followup.html
          ! grep -q "/api/admin/login" followup.html
          grep -q "API.listTasks(state.adminCode,{status:'open',limit:1})" followup.html
          grep -q "API.listRevisits" followup.html
          grep -q "legacy('/api/admin/customers'" followup.html
          grep -q 'id="panel-today"' followup.html
          grep -q 'id="panel-revisit"' followup.html
          grep -q 'id="panel-proposal"' followup.html
          grep -q 'id="panel-exclusion"' followup.html
          grep -q 'この端末から削除' followup.html
          ! grep -Eqi 'admin_code=|X-DPRO-Admin-Code[^'"'"']*[?&]' followup.html

          python3 - <<'PY_VALIDATE'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.scripts = []
                  self.in_script = False
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'script' and 'src' not in attrs:
                      self.in_script = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_script:
                      self.scripts.append(''.join(self.current))
                      self.in_script = False
                      self.current = []

          text = Path('followup.html').read_text(encoding='utf-8')
          parser = IdParser()
          parser.feed(text)

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f'ERROR: duplicate HTML IDs: {duplicates}')

          combined = '\n'.join(parser.scripts).strip()
          if not combined:
              raise SystemExit('ERROR: inline JavaScript was not found.')

          with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as handle:
              handle.write(combined)
              js_path = handle.name
          result = subprocess.run(['node', '--check', js_path], capture_output=True, text=True)
          Path(js_path).unlink(missing_ok=True)
          if result.returncode:
              raise SystemExit(result.stderr)

          if "localStorage.setItem(STORAGE_KEY,state.adminCode)" not in text:
              raise SystemExit('ERROR: approved device authentication storage was unexpectedly removed.')
          if "localStorage.removeItem(STORAGE_KEY)" not in text:
              raise SystemExit('ERROR: admin-code deletion function was unexpectedly removed.')

          print('HTML IDs: PASS')
          print('Inline JavaScript syntax: PASS')
          print('Existing followup features: PASS')
          print('Admin-code delete control: PASS')
          PY_VALIDATE

      - name: Commit followup authentication fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git add followup.html
          if git diff --cached --quiet; then
            echo 'ERROR: followup.html was not changed.'
            exit 1
          fi
          git commit -m 'Fix DPRO ESTATE followup authentication endpoint'
          git push origin "$TARGET_BRANCH"

      - name: Wait for GitHub Pages and verify live authentication path
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$ADMIN_CODE_SECRET"
          if [ -z "$code" ]; then code='1234'; fi
          echo "::add-mask::$code"

          published=0
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error \
              "$PAGE_BASE/followup.html?v=followup-auth-r2-${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/followup-live.html || true
            if grep -q 'ESTATE-NEXT-10-HOTFIX-FOLLOWUP-AUTH-R2' /tmp/followup-live.html 2>/dev/null; then
              published=1
              break
            fi
            sleep 10
          done
          if [ "$published" != '1' ]; then
            echo 'ERROR: updated followup.html was not published in time.'
            exit 1
          fi

          ! grep -q '/api/admin/login' /tmp/followup-live.html
          grep -q "API.listTasks(state.adminCode,{status:'open',limit:1})" /tmp/followup-live.html

          status="$(curl --silent --show-error -o /tmp/followup-auth.json -w '%{http_code}' \
            -H "X-DPRO-Admin-Code: $code" \
            -H "X-Admin-Code: $code" \
            "$NEXT_API_BASE/api/admin/followup-tasks?shop_code=$SHOP_CODE&status=open&limit=1")"
          echo "Followup read-only authentication HTTP $status"
          case "$status" in 2??) ;; *)
            python3 - <<'PY_SAFE_ERROR'
          from pathlib import Path
          import json
          try:
              data=json.loads(Path('/tmp/followup-auth.json').read_text(encoding='utf-8'))
              print({'ok':data.get('ok'), 'error':data.get('error') or data.get('message')})
          except Exception:
              print('Non-JSON error response received.')
          PY_SAFE_ERROR
            exit 1
            ;;
          esac

          python3 - <<'PY_AUTH_RESULT'
          from pathlib import Path
          import json
          data=json.loads(Path('/tmp/followup-auth.json').read_text(encoding='utf-8'))
          if data.get('ok') is not True:
              raise SystemExit({'ok':data.get('ok'),'error':data.get('error')})
          tasks=data.get('tasks')
          if not isinstance(tasks,list):
              raise SystemExit('ERROR: followup authentication response did not contain a task list.')
          print({'ok':True,'task_count_returned':len(tasks),'authentication':'PASS'})
          PY_AUTH_RESULT

      - name: Record completed-system hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          completed_at="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%:z')"

          cat > dpro-next/estate-hotfix-followup-auth.yml <<EOF_HOTFIX
          system: DPRO 不動産・賃貸内見 LINE
          hotfix: ESTATE-NEXT-10-HOTFIX-FOLLOWUP-AUTH-R2
          status: COMPLETE
          completed_at_jst: "$completed_at"
          defect: GET /api/admin/login endpoint did not exist
          resolution: GET /api/admin/followup-tasks with limit 1 for read-only authentication
          write_operation: false
          followup_login: PASS
          followup_tasks: PASS
          revisit_requests_preserved: true
          property_proposals_preserved: true
          customer_exclusions_preserved: true
          admin_code_delete_preserved: true
          worker_changed: false
          supabase_changed: false
          api_changed: false
          EOF_HOTFIX

          python3 - <<'PY_PROGRESS'
          from pathlib import Path
          path=Path('dpro-next/estate-progress.yml')
          text=path.read_text(encoding='utf-8')
          required=[
              'current_step: ESTATE-NEXT-COMPLETE',
              'next_step: NONE',
              'complete: true',
          ]
          missing=[item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: final completion ledger changed unexpectedly: {missing}')
          additions=[
              'post_complete_hotfix: ESTATE-NEXT-10-HOTFIX-FOLLOWUP-AUTH-R2',
              'followup_authentication: PASS',
              'followup_authentication_method: READ_ONLY_FOLLOWUP_TASK_LIST',
              'followup_authentication_verification: R2',
          ]
          lines=text.rstrip().splitlines()
          existing={line.split(':',1)[0].strip() for line in lines if ':' in line}
          for item in additions:
              key=item.split(':',1)[0]
              if key not in existing:
                  lines.append(item)
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY_PROGRESS

          git add dpro-next/estate-progress.yml dpro-next/estate-hotfix-followup-auth.yml
          git commit -m 'Record DPRO ESTATE followup authentication hotfix'
          git push origin "$TARGET_BRANCH"

      - name: Delete workflow and commit verified hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$WORKFLOW_PATH" .github/workflows/estate-next-10-followup-auth-r1.yml
          git add -A "$WORKFLOW_PATH"
          if ! git diff --cached --quiet; then
            git commit -m 'Remove completed DPRO ESTATE followup auth hotfix workflow'
            git push origin "$TARGET_BRANCH"
          fi

      - name: Publish hotfix summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF_SUMMARY'
          # DPRO ESTATE FOLLOWUP AUTH HOTFIX COMPLETE

          | 項目 | 結果 |
          |---|---|
          | 存在しない `/api/admin/login` | 削除 |
          | 読み取り専用認証 | PASS |
          | 追客一覧API | PASS |
          | 再相談・提案・除外条件 | 維持 |
          | 管理コード削除ボタン | 維持 |
          | Worker変更 | なし |
          | Supabase変更 | なし |
          | 完成台帳 | ESTATE-NEXT-COMPLETEを維持 |

          公開画面:
          https://dpromstk2000-lab.github.io/dpro-estate-line-liff/followup.html?demo=1
          EOF_SUMMARY
