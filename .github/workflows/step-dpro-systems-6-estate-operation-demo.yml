name: STEP DPRO-SYSTEMS-6 Estate Operation Demo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-6-estate-operation-demo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clarify estate operation demo
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          customer_banner = base64.b64decode("").decode("utf-8")
          staff_banner = base64.b64decode("").decode("utf-8")
          common_css = base64.b64decode("").decode("utf-8")
          marker = "/* DPRO-SYSTEMS-6 ESTATE OPERATION DEMO */"
          official_url = "https://dpro-shop.com/systems/estate"

          def read(name):
              return Path(name).read_text(encoding="utf-8")

          def write(name, value):
              Path(name).write_text(value, encoding="utf-8")

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit("ERROR: " + label + " target not found")

          def regex_once(text, pattern, replacement, label, already=None):
              if already and already in text:
                  return text
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count == 0:
                  raise SystemExit("ERROR: " + label + " target not found")
              return updated

          def add_style(text):
              if marker in text:
                  return text
              if "</style>" not in text:
                  raise SystemExit("ERROR: style closing tag not found")
              return text.replace("</style>", "\n" + common_css.strip() + "\n</style>", 1)

          def add_after_header(text, banner, label):
              if banner in text:
                  return text
              return regex_once(
                  text,
                  r'(</header>)',
                  r'\1\n' + banner,
                  label
              )

          # 1. お客様用LINE内見予約
          index = read("index.html")
          index = replace_once(
              index,
              "<title>DPRO 不動産・賃貸内見 LINE｜内見予約</title>",
              "<title>DPRO 不動産・賃貸内見 LINE｜公開操作デモ・内見予約</title>",
              "customer title"
          )
          index = replace_once(
              index,
              "<body>",
              '<body class="operation-demo-page">',
              "customer body class"
          )
          index = replace_once(
              index,
              '<div class="version">STEP ESTATE-12 | お客様用 index.html | PC見やすさ改善</div>',
              '<div class="version">DPRO ESTATE｜PUBLIC OPERATION DEMO</div>',
              "customer internal version"
          )
          index = replace_once(
              index,
              "<h1>LINEでかんたん<br>賃貸内見予約</h1>",
              "<h1>LINEでかんたん<br>賃貸内見予約 操作デモ</h1>",
              "customer hero title"
          )
          index = replace_once(
              index,
              "希望エリア・家賃・間取りを入力して、気になる物件の内見や店舗相談を予約できます。デモでは志免・宇美・須恵エリアの物件を表示します。",
              "希望条件や内見希望日時を入力し、実際の予約操作を体験できます。公開デモでは志免・宇美・須恵エリアの架空物件を表示します。",
              "customer hero copy"
          )
          index = replace_once(
              index,
              '<a class="hero-action" href="#member">予約確認</a>',
              '<a class="hero-action" href="#member">予約確認</a>\n          <a class="hero-action" href="https://dpro-shop.com/systems/estate">公式の機能説明</a>',
              "customer official link"
          )
          index = add_after_header(index, customer_banner, "customer demo banner")
          index = add_style(index)
          write("index.html", index)

          # 2. オーナーPC管理
          owner = read("owner.html")
          owner = replace_once(
              owner,
              "<title>DPRO 不動産・賃貸内見 LINE｜オーナー管理</title>",
              "<title>DPRO 不動産・賃貸内見 LINE｜公開操作デモ・オーナー管理</title>",
              "owner title"
          )
          owner = replace_once(
              owner,
              "<body>",
              '<body class="operation-demo-page">',
              "owner body class"
          )
          owner = replace_once(
              owner,
              "<small>DPRO 不動産・賃貸内見 LINE</small>",
              "<small>DPRO 不動産・賃貸内見 LINE / OPERATION DEMO</small>",
              "owner brand label"
          )
          owner = replace_once(
              owner,
              "<strong>オーナー管理</strong>",
              "<strong>オーナー管理 操作デモ</strong>",
              "owner brand title"
          )
          owner = replace_once(
              owner,
              '<a class="nav-link" id="checkLink" href="system-check.html">システム確認</a>',
              '<a class="nav-link official-demo-link" href="https://dpro-shop.com/systems/estate">公式の機能説明</a>',
              "owner remove internal check link"
          )
          owner, details_count = re.subn(
              r'\s*<details>\s*<summary>デモ・管理</summary>.*?営業前デモ準備.*?</details>',
              "",
              owner,
              count=1,
              flags=re.S
          )
          if details_count == 0 and "営業前デモ準備" in owner:
              raise SystemExit("ERROR: owner internal demo controls were not removed")
          owner = add_after_header(owner, staff_banner, "owner demo banner")
          owner = add_style(owner)
          write("owner.html", owner)

          # 3. iPad・現場スタッフ
          ipad = read("owner-ipad.html")
          ipad = replace_once(
              ipad,
              "<title>DPRO 不動産・賃貸内見 LINE｜現場スタッフ</title>",
              "<title>DPRO 不動産・賃貸内見 LINE｜公開操作デモ・現場スタッフ</title>",
              "ipad title"
          )
          ipad = replace_once(
              ipad,
              "<body>",
              '<body class="operation-demo-page">',
              "ipad body class"
          )
          ipad = replace_once(
              ipad,
              '<div class="brand"><small>現場スタッフ用</small><strong>DPRO 不動産・賃貸内見</strong></div>',
              '<div class="brand"><small>PUBLIC OPERATION DEMO</small><strong>DPRO 不動産・賃貸内見｜現場スタッフ</strong></div>',
              "ipad brand"
          )
          ipad = replace_once(
              ipad,
              '<div class="top-actions"><span class="status" id="todayLabel">-</span><span class="status" id="connectionLabel">未接続</span><button class="top-btn" id="refreshTopBtn">更新</button></div>',
              '<div class="top-actions"><span class="status" id="todayLabel">-</span><span class="status" id="connectionLabel">未接続</span><a class="official-demo-link" href="https://dpro-shop.com/systems/estate">公式説明</a><button class="top-btn" id="refreshTopBtn">更新</button></div>',
              "ipad official link"
          )
          ipad = replace_once(
              ipad,
              "管理コードを確認すると、今日の現場業務を表示します。",
              "公開操作デモです。管理コードを確認すると、架空データの現場業務を表示します。",
              "ipad demo notice"
          )
          ipad = add_after_header(ipad, staff_banner, "ipad demo banner")
          ipad = add_style(ipad)
          write("owner-ipad.html", ipad)

          # 4. 追客・再相談
          followup = read("followup.html")
          followup = replace_once(
              followup,
              "<title>DPRO 不動産・賃貸内見｜追客・再相談</title>",
              "<title>DPRO 不動産・賃貸内見｜公開操作デモ・追客・再相談</title>",
              "followup title"
          )
          followup = replace_once(
              followup,
              "<body>",
              '<body class="operation-demo-page">',
              "followup body class"
          )
          followup = replace_once(
              followup,
              "<div><small>オーナー・スタッフ専用</small><h1>追客・再相談</h1><p>再相談、内見後フォロー、新着物件提案を一つの流れで管理します。</p></div>",
              "<div><small>PUBLIC OPERATION DEMO</small><h1>追客・再相談 操作デモ</h1><p>架空データで、再相談、内見後フォロー、新着物件提案の流れを体験します。</p></div>",
              "followup hero"
          )
          followup = replace_once(
              followup,
              '<a class="back" id="ownerBackLink" href="owner.html">オーナー管理へ戻る</a>',
              '<div class="demo-top-links"><a class="back" id="ownerBackLink" href="owner.html">オーナー管理へ戻る</a><a class="official-demo-link" href="https://dpro-shop.com/systems/estate">公式の機能説明</a></div>',
              "followup official link"
          )
          followup = add_after_header(followup, staff_banner, "followup demo banner")
          followup = add_style(followup)
          write("followup.html", followup)

          # 5. 店舗設定
          settings = read("owner-settings.html")
          settings = replace_once(
              settings,
              "<title>DPRO 不動産・賃貸内見 LINE｜店舗設定</title>",
              "<title>DPRO 不動産・賃貸内見 LINE｜公開操作デモ・店舗設定</title>",
              "settings title"
          )
          settings = replace_once(
              settings,
              "<body>",
              '<body class="operation-demo-page">',
              "settings body class"
          )
          settings = replace_once(
              settings,
              "<small>DPRO 不動産・賃貸内見 LINE</small>",
              "<small>DPRO 不動産・賃貸内見 LINE / OPERATION DEMO</small>",
              "settings brand label"
          )
          settings = replace_once(
              settings,
              "<strong>店舗設定</strong>",
              "<strong>店舗設定 操作デモ</strong>",
              "settings brand title"
          )
          settings = replace_once(
              settings,
              '<a class="nav-link" id="ipadLink" href="owner-ipad.html">iPad・スタッフ画面</a>',
              '<a class="nav-link" id="ipadLink" href="owner-ipad.html">iPad・スタッフ画面</a>\n      <a class="nav-link official-demo-link" href="https://dpro-shop.com/systems/estate">公式の機能説明</a>',
              "settings official link"
          )
          settings = add_after_header(settings, staff_banner, "settings demo banner")
          settings = add_style(settings)
          write("owner-settings.html", settings)

          # 自動検査
          checks = {
              "index.html": read("index.html"),
              "owner.html": read("owner.html"),
              "owner-ipad.html": read("owner-ipad.html"),
              "followup.html": read("followup.html"),
              "owner-settings.html": read("owner-settings.html")
          }

          for filename, content in checks.items():
              assert "operation-demo-page" in content, filename
              assert official_url in content, filename
              assert marker in content, filename

          assert "PUBLIC OPERATION DEMO" in checks["index.html"]
          assert "STEP ESTATE-12" not in checks["index.html"]
          assert "賃貸内見予約 操作デモ" in checks["index.html"]
          assert "system-check.html" not in checks["owner.html"]
          assert "システム確認" not in checks["owner.html"]
          assert "営業前デモ準備" not in checks["owner.html"]
          assert "現場スタッフ用" not in checks["owner-ipad.html"]
          assert "PUBLIC OPERATION DEMO" in checks["owner-ipad.html"]
          assert "追客・再相談 操作デモ" in checks["followup.html"]
          assert "店舗設定 操作デモ" in checks["owner-settings.html"]

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html owner.html owner-ipad.html followup.html owner-settings.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-6 clarify estate operation demo"
          git push
