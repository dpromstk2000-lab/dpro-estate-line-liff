name: DPRO ESTATE NEXT-10 Contract Owner Separation R2

'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/estate-next-10-contract-owner-separation-r2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dpro-estate-next-10-contract-owner-separation-r2
  cancel-in-progress: false

jobs:
  contract-owner-separation-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: main
      R1_WORKFLOW: .github/workflows/estate-next-10-contract-owner-separation-r1.yml
      R2_WORKFLOW: .github/workflows/estate-next-10-contract-owner-separation-r2.yml
      PAGE_BASE: https://dpromstk2000-lab.github.io/dpro-estate-line-liff
      LEGACY_API: https://dpro-estate-line-api.dpromstk2000.workers.dev
      BACKUP_TAG: dpro-estate-next-10-contract-owner-separation-before-20260725

    steps:
      - name: Checkout repository with R1 partial installation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify R1 partial installation and completed system
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s owner-settings.html
          test -s config.js
          test -s dpro-next/estate-progress.yml
          test -s dpro-next/estate-contract-owner-access.yml
          test -s "$R1_WORKFLOW"

          test "$(awk -F': ' '/^current_step:/{print $2;exit}' dpro-next/estate-progress.yml)" = 'ESTATE-NEXT-COMPLETE'
          test "$(awk -F': ' '/^complete:/{print $2;exit}' dpro-next/estate-progress.yml)" = 'true'

          grep -q 'ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R1' owner-settings.html
          grep -q 'data-settings-button="security"' owner-settings.html
          grep -q 'data-settings-button="demo"' owner-settings.html
          grep -q 'data-settings-panel="security"' owner-settings.html
          grep -q 'data-settings-panel="demo"' owner-settings.html
          grep -q "deploymentMode: window.DPRO_ESTATE_DEPLOYMENT_MODE || 'demo'" config.js
          grep -q "shopCode: window.DPRO_ESTATE_SHOP_CODE || 'dpro_estate_demo'" config.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          tag_commit="$(git rev-parse "$BACKUP_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
            echo 'ERROR: R1 backup tag is not an ancestor of current main.'
            exit 1
          fi

          echo 'R1 application changes are installed. R2 will resume verification only.'

      - name: Diagnose and guard exact R1 test defect
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY_DIAGNOSE'
          from pathlib import Path

          settings = Path('owner-settings.html').read_text(encoding='utf-8')
          r1 = Path(
              '.github/workflows/estate-next-10-contract-owner-separation-r1.yml'
          ).read_text(encoding='utf-8')

          required = [
              "const state={adminCode:'',authenticated:false",
              "if(!state.demoEnvironment){toast('契約店舗ではデモ準備を実行できません。'",
              "if(path==='/api/admin/demo/prepare'&&!state.demoEnvironment)",
          ]
          missing = [item for item in required if item not in settings]
          if missing:
              raise SystemExit(f'ERROR: R1 application guard is missing: {missing}')

          if 'window.state.authenticated = true' not in r1:
              raise SystemExit(
                  'ERROR: the expected R1 verification defect was not found.'
              )

          if 'window.state' in settings:
              raise SystemExit(
                  'ERROR: application state must not be exposed on window.'
              )

          print('Diagnosis: R1 browser test referenced window.state.')
          print('Application uses lexical const state and is not defective.')
          print('R2 will call prepareDemo() without mutating authentication state.')
          PY_DIAGNOSE

      - name: Revalidate R1 HTML JavaScript IDs and access rules
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY_VALIDATE'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.inline_scripts = []
                  self.in_script = False
                  self.buffer = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'script' and 'src' not in attrs:
                      self.in_script = True
                      self.buffer = []

              def handle_data(self, data):
                  if self.in_script:
                      self.buffer.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_script:
                      self.inline_scripts.append(''.join(self.buffer))
                      self.in_script = False
                      self.buffer = []

          text = Path('owner-settings.html').read_text(encoding='utf-8')
          parser = Parser()
          parser.feed(text)

          duplicates = sorted({
              value for value in parser.ids
              if parser.ids.count(value) > 1
          })
          if duplicates:
              raise SystemExit(f'ERROR: duplicate owner-settings IDs: {duplicates}')

          combined = '\n'.join(parser.inline_scripts).strip()
          if not combined:
              raise SystemExit('ERROR: owner-settings inline JavaScript is missing.')

          with tempfile.NamedTemporaryFile(
              'w',
              suffix='.js',
              encoding='utf-8',
              delete=False
          ) as handle:
              handle.write(combined)
              js_path = handle.name

          result = subprocess.run(
              ['node', '--check', js_path],
              capture_output=True,
              text=True
          )
          Path(js_path).unlink(missing_ok=True)
          if result.returncode:
              raise SystemExit(result.stderr)

          required = [
              "return requestedDemo&&CONFIG.shopCode===demoShopCode&&deploymentMode==='demo'",
              "if(name==='demo'&&!state.demoEnvironment)",
              "if(path==='/api/admin/demo/prepare'&&!state.demoEnvironment)",
              "if(!state.demoEnvironment){toast('契約店舗ではデモ準備を実行できません.'".replace('.', '。'),
              '管理・セキュリティ',
              'DPRO専用',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: access separation rules missing: {missing}')

          if 'data-settings-button="system"' in text:
              raise SystemExit('ERROR: old mixed system menu remains.')
          if 'data-settings-panel="system"' in text:
              raise SystemExit('ERROR: old mixed system panel remains.')

          print('HTML duplicate IDs: PASS')
          print('JavaScript syntax: PASS')
          print('Contract/demo access rules: PASS')
          PY_VALIDATE

          node --check config.js

      - name: Confirm R1 pages are published
        shell: bash
        run: |
          set -Eeuo pipefail

          published=0
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error \
              "$PAGE_BASE/owner-settings.html?demo=1&v=contract-owner-r2-${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/settings-live.html || true

            if grep -q 'ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R1' /tmp/settings-live.html 2>/dev/null; then
              published=1
              break
            fi
            sleep 10
          done

          if [ "$published" != '1' ]; then
            echo 'ERROR: R1 owner-settings page is not published.'
            exit 1
          fi

          grep -q '管理・セキュリティ' /tmp/settings-live.html
          grep -q 'DPRO専用' /tmp/settings-live.html
          echo 'Published R1 access separation confirmed.'

      - name: Run corrected demo and contract browser tests
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install --no-save --no-package-lock playwright-core@1.52.0 >/dev/null 2>&1

          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser_path" ]; then
            echo 'ERROR: a system Chromium browser was not found.'
            exit 1
          fi

          mkdir -p /tmp/contract-owner-separation-r2

          BROWSER_PATH="$browser_path" PAGE_BASE="$PAGE_BASE" node <<'JS_BROWSER'
          const { chromium } = require('playwright-core');
          const fs = require('fs');

          const executablePath = process.env.BROWSER_PATH;
          const pageBase = process.env.PAGE_BASE;

          async function mockSettings(page) {
            await page.route('**/api/admin/settings**', async route => {
              const method = route.request().method();
              if (method === 'GET') {
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify({
                    ok: true,
                    shop: {
                      shop_name: '契約店舗テスト',
                      phone: '0920000000',
                      address: '福岡県',
                      area_title: '希望エリア',
                      business_start_time: '10:00',
                      business_end_time: '18:00',
                      slot_minutes: 30,
                      booking_days_ahead: 60,
                      regular_holidays: [],
                      max_viewings_per_day: 8,
                      max_reservations_per_slot: 1,
                      same_day_booking_cutoff_time: '09:00',
                      cancel_deadline_hours: 24
                    },
                    areas: [],
                    message_templates: []
                  })
                });
                return;
              }

              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ ok: true })
              });
            });
          }

          async function inspectDemo(browser) {
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 }
            });

            await page.addInitScript(() => {
              localStorage.clear();
            });
            await mockSettings(page);

            await page.goto(
              `${pageBase}/owner-settings.html?demo=1&v=contract-owner-r2-${Date.now()}`,
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            const initial = await page.evaluate(() => ({
              mode: document.documentElement.dataset.deploymentMode,
              demoNavHidden:
                document.getElementById('demoSystemNav').classList.contains('hidden'),
              demoPanelHidden:
                document.querySelector('[data-settings-panel="demo"]')
                  .classList.contains('hidden'),
              securityExists:
                Boolean(document.querySelector('[data-settings-button="security"]'))
            }));

            if (initial.mode !== 'demo') {
              throw new Error(
                `Demo mode was not detected: ${JSON.stringify(initial)}`
              );
            }
            if (
              initial.demoNavHidden ||
              initial.demoPanelHidden ||
              !initial.securityExists
            ) {
              throw new Error(
                `Demo controls are not correctly available: ${JSON.stringify(initial)}`
              );
            }

            await page.evaluate(() => window.openSettingsPanel('demo'));
            const activePanel = await page.evaluate(() =>
              document.querySelector('.settings-panel.active')
                ?.dataset.settingsPanel
            );
            if (activePanel !== 'demo') {
              throw new Error(`Demo panel did not open: ${activePanel}`);
            }

            await page.screenshot({
              path: '/tmp/contract-owner-separation-r2/demo-settings.png',
              fullPage: true
            });

            await page.close();
            return { ...initial, activePanel };
          }

          async function inspectContract(browser, width, height, label) {
            const page = await browser.newPage({
              viewport: { width, height }
            });

            await page.addInitScript(() => {
              localStorage.clear();
              window.DPRO_ESTATE_DEPLOYMENT_MODE = 'contract';
              window.DPRO_ESTATE_SHOP_CODE = 'dpro_estate_contract_test';
              window.confirm = () => true;
            });

            await mockSettings(page);

            let demoPrepareRequests = 0;
            await page.route('**/api/admin/demo/prepare**', async route => {
              demoPrepareRequests += 1;
              await route.fulfill({
                status: 500,
                contentType: 'application/json',
                body: JSON.stringify({
                  ok: false,
                  error: 'This request must never be reached.'
                })
              });
            });

            await page.goto(
              `${pageBase}/owner-settings.html?demo=1&v=contract-owner-r2-${Date.now()}`,
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            const initial = await page.evaluate(() => ({
              mode: document.documentElement.dataset.deploymentMode,
              demoNavHidden:
                document.getElementById('demoSystemNav').classList.contains('hidden'),
              demoPanelHidden:
                document.querySelector('[data-settings-panel="demo"]')
                  .classList.contains('hidden'),
              securityButtonExists:
                Boolean(document.querySelector('[data-settings-button="security"]'))
            }));

            if (initial.mode !== 'contract') {
              throw new Error(
                `${label}: contract mode was not detected: ${JSON.stringify(initial)}`
              );
            }
            if (
              !initial.demoNavHidden ||
              !initial.demoPanelHidden ||
              !initial.securityButtonExists
            ) {
              throw new Error(
                `${label}: contract visibility is incorrect: ${JSON.stringify(initial)}`
              );
            }

            await page.evaluate(() => window.openSettingsPanel('demo'));
            const activeAfterDirectOpen = await page.evaluate(() =>
              document.querySelector('.settings-panel.active')
                ?.dataset.settingsPanel
            );
            if (activeAfterDirectOpen === 'demo') {
              throw new Error(`${label}: direct demo panel opening was not blocked.`);
            }

            // R2 correction:
            // Do not access window.state. prepareDemo() checks demoEnvironment
            // before authenticated, so a direct call must be rejected immediately.
            await page.evaluate(async () => {
              await window.prepareDemo();
            });

            await page.waitForTimeout(250);

            if (demoPrepareRequests !== 0) {
              throw new Error(
                `${label}: blocked prepareDemo still sent ${demoPrepareRequests} request(s).`
              );
            }

            const blockedMessage = await page.locator('#toast').textContent();
            if (!String(blockedMessage || '').includes('契約店舗ではデモ準備を実行できません')) {
              throw new Error(
                `${label}: the contract rejection message was not shown: ${blockedMessage}`
              );
            }

            await page.evaluate(() => window.openSettingsPanel('security'));
            const securityVisible =
              await page.locator('[data-settings-panel="security"]').isVisible();
            if (!securityVisible) {
              throw new Error(`${label}: management security panel is unavailable.`);
            }

            const overflow = await page.evaluate(() =>
              Math.max(
                0,
                document.documentElement.scrollWidth - window.innerWidth
              )
            );
            if (overflow > 2) {
              throw new Error(`${label}: horizontal overflow ${overflow}px`);
            }

            await page.screenshot({
              path: `/tmp/contract-owner-separation-r2/${label}.png`,
              fullPage: true
            });

            await page.close();

            return {
              ...initial,
              activeAfterDirectOpen,
              demoPrepareRequests,
              blockedMessage,
              securityVisible,
              horizontalOverflow: overflow
            };
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath,
              args: ['--no-sandbox']
            });

            try {
              const result = {
                demoDesktop:
                  await inspectDemo(browser),
                contractDesktop:
                  await inspectContract(
                    browser,
                    1440,
                    900,
                    'contract-desktop'
                  ),
                contractMobile:
                  await inspectContract(
                    browser,
                    390,
                    844,
                    'contract-mobile'
                  )
              };

              fs.writeFileSync(
                '/tmp/contract-owner-separation-r2/browser-result.json',
                JSON.stringify(result, null, 2)
              );
              console.log(JSON.stringify(result, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS_BROWSER

      - name: Probe unknown contract shop without false network failure
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p /tmp/contract-owner-separation-r2
          probe_shop="contract_guard_probe_r2_${GITHUB_RUN_ID}"
          response_file=/tmp/contract-owner-separation-r2/server-probe-raw.txt

          http_status="$(curl --silent --show-error \
            --connect-timeout 15 \
            --max-time 35 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-Admin-Code: 1234' \
            --header 'X-DPRO-Admin-Code: 1234' \
            --data "{\"shop_code\":\"$probe_shop\",\"admin_code\":\"1234\",\"demo_mode\":true}" \
            "$LEGACY_API/api/admin/demo/prepare" || true)"

          PROBE_HTTP="$http_status" PROBE_FILE="$response_file" \
          python3 - <<'PY_PROBE'
          import json
          import os
          from pathlib import Path

          status_text = os.environ.get('PROBE_HTTP') or '0'
          try:
              status = int(status_text)
          except ValueError:
              status = 0

          raw_path = Path(os.environ['PROBE_FILE'])
          raw = (
              raw_path.read_text(encoding='utf-8', errors='replace')
              if raw_path.exists()
              else ''
          )

          try:
              data = json.loads(raw) if raw else {}
          except Exception:
              data = {'parse_error': True}

          explicitly_accepted = (
              200 <= status < 300 and
              isinstance(data, dict) and
              data.get('ok') is True
          )

          if explicitly_accepted:
              raise SystemExit(
                  'ERROR: unknown contract shop passed demo preparation.'
              )

          if status == 0:
              result = {
                  'http_status': 0,
                  'unknown_contract_shop_rejected': None,
                  'server_probe_status': 'ATTENTION_NETWORK_UNAVAILABLE',
                  'legacy_worker_source_in_repository': False,
                  'valid_contract_shop_server_guard':
                      'ATTENTION_SOURCE_UNAVAILABLE'
              }
          else:
              result = {
                  'http_status': status,
                  'unknown_contract_shop_rejected': True,
                  'response_ok':
                      data.get('ok') if isinstance(data, dict) else None,
                  'server_probe_status': 'PASS_REJECTED',
                  'legacy_worker_source_in_repository': False,
                  'valid_contract_shop_server_guard':
                      'ATTENTION_SOURCE_UNAVAILABLE'
              }

          output = Path(
              '/tmp/contract-owner-separation-r2/server-probe.json'
          )
          output.write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY_PROBE

      - name: Upload R2 browser and probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: estate-contract-owner-separation-r2
          path: /tmp/contract-owner-separation-r2
          retention-days: 30

      - name: Record R2 completion and preserve final system status
        shell: bash
        run: |
          set -Eeuo pipefail

          completed_at="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%:z')"

          cp \
            /tmp/contract-owner-separation-r2/browser-result.json \
            dpro-next/estate-contract-owner-browser-result.json

          cp \
            /tmp/contract-owner-separation-r2/server-probe.json \
            dpro-next/estate-contract-owner-server-probe.json

          cat > dpro-next/estate-hotfix-contract-owner-separation.yml <<EOF_RECORD
          system: DPRO 不動産・賃貸内見 LINE
          hotfix: ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R2
          status: COMPLETE_WITH_SERVER_ATTENTION
          completed_at_jst: "$completed_at"
          r1_application_installation: PRESERVED
          r1_test_failure:
            application_defect: false
            verification_defect: WINDOW_STATE_REFERENCE
            corrected_in_r2: true
          demo_visibility_condition:
            query_demo_equals_1: PASS
            demo_shop_code_match: PASS
            deployment_mode_demo: PASS
            all_conditions_required: PASS
          contract_owner_demo_menu_hidden: PASS
          contract_owner_demo_panel_hidden: PASS
          contract_owner_direct_panel_open_blocked: PASS
          contract_owner_prepare_demo_client_blocked: PASS
          contract_owner_demo_api_request_count: 0
          contract_owner_security_panel_visible: PASS
          demo_environment_controls_visible: PASS
          desktop_visual_check: PASS
          mobile_visual_check: PASS
          legacy_worker_source_in_repository: false
          valid_contract_shop_server_guard: ATTENTION_SOURCE_UNAVAILABLE
          worker_changed: false
          supabase_changed: false
          api_changed: false
          existing_features_preserved: true
          EOF_RECORD

          python3 - <<'PY_PROGRESS'
          from pathlib import Path

          path = Path('dpro-next/estate-progress.yml')
          text = path.read_text(encoding='utf-8')

          required = [
              'current_step: ESTATE-NEXT-COMPLETE',
              'next_step: NONE',
              'complete: true',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(
                  f'ERROR: final completion ledger changed unexpectedly: {missing}'
              )

          updates = {
              'post_complete_access_hotfix':
                  'ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R2',
              'contract_owner_demo_menu': 'HIDDEN',
              'contract_owner_demo_prepare': 'BLOCKED_CLIENT_SIDE',
              'contract_owner_demo_api_requests': '0',
              'contract_owner_security_panel': 'PASS',
              'demo_access_condition':
                  'DEMO_QUERY_AND_DEMO_SHOP_AND_DEMO_MODE',
              'demo_server_guard':
                  'ATTENTION_LEGACY_SOURCE_UNAVAILABLE',
          }

          lines = text.rstrip().splitlines()
          positions = {
              line.split(':', 1)[0].strip(): index
              for index, line in enumerate(lines)
              if ':' in line
          }

          for key, value in updates.items():
              line = f'{key}: {value}'
              if key in positions:
                  lines[positions[key]] = line
              else:
                  lines.append(line)

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY_PROGRESS

          git add \
            dpro-next/estate-progress.yml \
            dpro-next/estate-hotfix-contract-owner-separation.yml \
            dpro-next/estate-contract-owner-browser-result.json \
            dpro-next/estate-contract-owner-server-probe.json

          git commit -m 'Verify DPRO ESTATE contract owner separation R2'
          git push origin "$TARGET_BRANCH"

      - name: Delete failed R1 and completed R2 workflows
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$R1_WORKFLOW" "$R2_WORKFLOW"
          git add -A "$R1_WORKFLOW" "$R2_WORKFLOW"

          if ! git diff --cached --quiet; then
            git commit -m 'Remove completed DPRO ESTATE access workflows'
            git push origin "$TARGET_BRANCH"
          fi

      - name: Publish R2 completion summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF_SUMMARY'
          # DPRO ESTATE CONTRACT OWNER SEPARATION R2 COMPLETE

          R1で失敗したのは画面ではなく、自動検査が非公開の
          `window.state`を参照したことが原因です。

          | 項目 | 結果 |
          |---|---|
          | R1画面修正 | 維持 |
          | 契約オーナー：管理・セキュリティ | 表示 |
          | 契約オーナー：デモ・保守 | 非表示 |
          | デモパネル直接表示 | 拒否 |
          | prepareDemo直接実行 | 拒否 |
          | デモAPI通信 | 0件 |
          | デモ環境のデモ・保守 | 表示 |
          | Desktop | PASS |
          | Mobile | PASS |
          | Worker変更 | なし |
          | Supabase変更 | なし |
          | 完成台帳 | ESTATE-NEXT-COMPLETEを維持 |

          デモ画面:
          https://dpromstk2000-lab.github.io/dpro-estate-line-liff/owner-settings.html?demo=1&v=contract-owner-r2

          契約オーナー相当の通常URL:
          https://dpromstk2000-lab.github.io/dpro-estate-line-liff/owner-settings.html?v=contract-owner-r2
          EOF_SUMMARY
