name: STEP ESTATE PRODUCT READY R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/STEP-ESTATE-PRODUCT-READY-R2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estate-product-ready-r2
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/STEP-ESTATE-PRODUCT-READY-R2.yml
  BASELINE_SHA: 44995e1c4bf15797abd4704e8b51ff417841d26a
  BACKUP_TAG: backup-estate-before-product-ready-r2-20260823
  GATEWAY: https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-estate-product-ready-r2-gateway
  EXPECTED_ADAPTER: DPRO-CONTROL-ADAPTER-1.0-ESTATE-R2-20260823
  EXPECTED_EXTENSION: ESTATE-NEXT-8-R3-EXTENSION-20260724
  EXPECTED_LEGACY: estate-3-worker-api-20260710
  EXPECTED_DATABASE: ESTATE-DB-PR-R2-20260823
  EXPECTED_FRONTEND: ESTATE-NEXT-10

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout locked source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify baseline and create rollback tag
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          test -f config.js
          test -f system-check.html
          test -f index.html
          test -f owner.html
          test -f owner-ipad.html
          test -f followup.html
          test -f assets/estate-next-10/operation-sheet-verification.json
          grep -q "version: 'ESTATE-NEXT-10'" config.js
          UNEXPECTED="$(git diff --name-only "$BASELINE_SHA"..HEAD | grep -v "^${WORKFLOW_FILE}$" || true)"
          test -z "$UNEXPECTED" || { echo "Unexpected source drift before ESTATE R2:"; echo "$UNEXPECTED"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$BACKUP_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$BACKUP_TAG")" = "$BASELINE_SHA"
          else
            git tag -a "$BACKUP_TAG" "$BASELINE_SHA" -m "ESTATE before Product READY R2"
            git push origin "$BACKUP_TAG"
          fi

      - name: Apply minimal Product READY source bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          gateway = "https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-estate-product-ready-r2-gateway"
          legacy = "https://dpro-estate-line-api.dpromstk2000.workers.dev"

          p = Path("config.js")
          t = p.read_text(encoding="utf-8")
          old = "    apiBase: 'https://dpro-estate-line-api.dpromstk2000.workers.dev',\n"
          new = (
              f"    apiBase: '{gateway}',\n"
              f"    legacyApiBase: '{legacy}',\n"
              f"    productReadyCheck: '{gateway}/api/product-ready/check',\n"
              "    productReadyRevision: 'R2-20260823',\n"
          )
          if gateway not in t:
              if old not in t:
                  raise SystemExit("config.js legacy apiBase target not found")
              t = t.replace(old, new, 1)
              p.write_text(t, encoding="utf-8")

          addon = r'''(function () {
            'use strict';
            const GATEWAY = 'https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-estate-product-ready-r2-gateway';
            function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
            async function run(){
              const status=document.getElementById('productReadyR2Status');
              const box=document.getElementById('productReadyR2Json');
              status.textContent='確認中...'; status.className='status attention';
              try{
                const url=window.DPRO_ESTATE_CONFIG?.productReadyCheck || `${GATEWAY}/api/product-ready/check`;
                const r=await fetch(url,{headers:{Accept:'application/json'},cache:'no-store'});
                const d=await r.json();
                const ok=r.ok&&d.ok===true&&d.versions?.versionsAligned===true&&d.compatibility?.phoneNormalization===true&&d.compatibility?.serverPastDateGuard===true&&d.calendar?.exceptionModel===true&&d.calendar?.exceptionOverridesRegularHoliday===true&&d.staff?.signedSession===true&&d.staff?.ownerMutationAuthority===false&&d.staff?.auditTable===true&&d.line?.serverVerifiedLineIdentityCapability===true&&d.line?.phoneOnlyProduction===false&&d.line?.clientSuppliedIdentityAccepted===false;
                status.textContent=ok?'PRODUCT READY R2 基盤 OK':'要確認'; status.className=`status ${ok?'ok':'ng'}`;
                box.textContent=JSON.stringify(d,null,2);
              }catch(e){status.textContent='要確認';status.className='status ng';box.textContent=JSON.stringify({ok:false,error:String(e?.message||e)},null,2);}
            }
            function mount(){
              if(document.getElementById('productReadyR2Card')) return;
              const host=document.querySelector('main.wrap')||document.querySelector('main')||document.body;
              const card=document.createElement('section');
              card.className='card'; card.id='productReadyR2Card';
              card.innerHTML=`<h2>PRODUCT READY R2 確認</h2><div class="desc">Version整合・電話正規化・過去予約拒否・例外営業日・Staff権限/監査・LINE安全境界を読取専用で確認します。</div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px"><button class="btn" id="productReadyR2Run" type="button">PRODUCT READY確認</button><strong id="productReadyR2Status" class="status">未確認</strong></div><pre id="productReadyR2Json" style="margin-top:12px;max-height:360px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#f7faf9;border:1px solid #dce8e4;border-radius:12px;padding:12px;font-size:11px">{}</pre>`;
              host.insertBefore(card,host.firstChild);
              document.getElementById('productReadyR2Run').addEventListener('click',run);
              run().catch(()=>{});
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
          }());'''
          Path("system-check-product-ready-r2.js").write_text(addon+"\n",encoding="utf-8")

          sp = Path("system-check.html")
          st = sp.read_text(encoding="utf-8")
          tag = '<script src="system-check-product-ready-r2.js?v=estate-product-ready-r2"></script>'
          if tag not in st:
              if '</body>' not in st: raise SystemExit('system-check.html missing </body>')
              st = st.replace('</body>',f'  {tag}\n</body>',1)
              sp.write_text(st,encoding="utf-8")

          manifest = {
            "systemCode":"ESTATE",
            "standard":"DPRO-CONTROL-ADAPTER-1.0",
            "adapterVersion":"DPRO-CONTROL-ADAPTER-1.0-ESTATE-R2-20260823",
            "adapterUrl":gateway,
            "legacyWorkerVersion":"estate-3-worker-api-20260710",
            "extensionWorkerVersion":"ESTATE-NEXT-8-R3-EXTENSION-20260724",
            "databaseVersion":"ESTATE-DB-PR-R2-20260823",
            "frontendVersion":"ESTATE-NEXT-10",
            "lineIdentity":"server_verified_id_token_capability",
            "lineTenantBinding":"deferred_until_contract",
            "staffBoundary":"server_scoped_signed_session",
            "staffOwnerMutationAuthority":False,
            "centralPolicy":"PRECONTRACT_CAPABILITY_CUSTOMER_BINDING_DEFERRED",
            "legacySourceRecovered":False,
            "legacyCompatibilityGateway":True
          }
          Path("dpro-product-ready-adapter.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          node --check config.js
          node --check system-check-product-ready-r2.js
          grep -q 'dpro-estate-product-ready-r2-gateway' config.js
          grep -q 'system-check-product-ready-r2.js' system-check.html

      - name: Live verify Product READY runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/estate-product-ready-r2
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          base=os.environ['GATEWAY'].rstrip('/')
          def get(path):
              req=urllib.request.Request(base+path,headers={'Accept':'application/json','User-Agent':'ESTATE-PRODUCT-READY-R2'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code,json.loads(e.read().decode() or '{}')
          status,check=get('/api/product-ready/check')
          if status!=200 or check.get('ok') is not True: raise SystemExit(f'product-ready check NG: {status} {check}')
          versions=check.get('versions',{})
          if versions.get('versionsAligned') is not True: raise SystemExit(f'versions not aligned: {versions}')
          expected=versions.get('expected',{}); observed=versions.get('observed',{})
          mapping={'adapter':'EXPECTED_ADAPTER','extension_worker':'EXPECTED_EXTENSION','legacy_worker':'EXPECTED_LEGACY','database':'EXPECTED_DATABASE','frontend':'EXPECTED_FRONTEND'}
          for key,envkey in mapping.items():
              ev=os.environ[envkey]
              if expected.get(key)!=ev or observed.get(key)!=ev: raise SystemExit(f'version mismatch {key}: {expected.get(key)} / {observed.get(key)} != {ev}')
          comp=check.get('compatibility',{})
          if not(comp.get('phoneNormalization') is True and comp.get('serverPastDateGuard') is True and comp.get('legacyIdentityPreserved') is True): raise SystemExit(f'compatibility NG: {comp}')
          cal=check.get('calendar',{})
          if not(cal.get('exceptionModel') is True and cal.get('temporaryClosed') is True and cal.get('specialOpen') is True and cal.get('exceptionOverridesRegularHoliday') is True and cal.get('serverReservationGuard') is True): raise SystemExit(f'calendar NG: {cal}')
          staff=check.get('staff',{})
          if not(staff.get('signedSession') is True and staff.get('expiry') is True and staff.get('revoke') is True and staff.get('assignedCaseScope') is True and staff.get('ownerMutationAuthority') is False and staff.get('auditTable') is True): raise SystemExit(f'staff NG: {staff}')
          line=check.get('line',{})
          if not(line.get('serverVerifiedLineIdentityCapability') is True and line.get('phoneOnlyProduction') is False and line.get('tenantProductionBinding')=='deferred_until_contract' and line.get('clientSuppliedIdentityAccepted') is False): raise SystemExit(f'line NG: {line}')
          hstatus,health=get('/api/health')
          if hstatus!=200 or health.get('version')!=os.environ['EXPECTED_LEGACY']: raise SystemExit(f'legacy health compatibility NG: {hstatus} {health}')
          out={'ok':True,'productReadyCheck':check,'legacyHealth':{'status':hstatus,'version':health.get('version'),'db_ok':health.get('db_ok')}}
          open('qa/estate-product-ready-r2/runtime.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Verify preserved A4 and QR evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          p='assets/estate-next-10/operation-sheet-verification.json'
          d=json.load(open(p,encoding='utf-8'))
          ok=(d.get('pdf_page_count')==1 and d.get('a4_portrait') is True and d.get('render_verified') is True and d.get('qr_expected_count')==5 and d.get('qr_decoded_count')==5 and d.get('qr_exact_match') is True)
          if not ok: raise SystemExit(f'A4/QR evidence NG: {d}')
          out={'ok':True,'source':p,'pdf_page_count':d['pdf_page_count'],'a4_portrait':d['a4_portrait'],'render_verified':d['render_verified'],'qr_expected_count':d['qr_expected_count'],'qr_decoded_count':d['qr_decoded_count'],'qr_exact_match':d['qr_exact_match']}
          open('qa/estate-product-ready-r2/a4-qr.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Browser QA PC / 390 / 320 / iPad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/estate-browser qa/estate-product-ready-r2/screens
          cd /tmp/estate-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 >/tmp/estate-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > /tmp/estate-browser/qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const out=process.env.GITHUB_WORKSPACE+'/qa/estate-product-ready-r2/screens';
          const base='http://127.0.0.1:4173';
          const cases=[
            ['pc-owner','owner.html',1440,1000],
            ['customer-390','index.html',390,844],
            ['customer-320','index.html',320,720],
            ['owner-320','owner.html',320,844],
            ['followup-320','followup.html',320,844],
            ['system-check-320','system-check.html',320,844],
            ['ipad','owner-ipad.html',1024,768],
          ];
          const results=[];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [key,file,width,height] of cases){
              if(!fs.existsSync(process.env.GITHUB_WORKSPACE+'/'+file)) throw new Error('missing QA page '+file);
              const page=await browser.newPage({viewport:{width,height}});
              const jsErrors=[];
              page.on('pageerror',e=>jsErrors.push('pageerror:'+e.message));
              page.on('console',m=>{if(m.type()==='error')jsErrors.push('console:'+m.text())});
              await page.route('**/*',async route=>{
                const u=route.request().url();
                if(u.includes('workers.dev')||u.includes('supabase.co/functions/v1/')){
                  const body={ok:true,shop:{shop_code:'dpro_estate_demo',shop_name:'DPRO不動産デモ',business_start_time:'10:00',business_end_time:'18:00',regular_holidays:['水'],slot_minutes:60},settings:{},customers:[],reservations:[],properties:[],cases:[],followups:[],tasks:[],staff:[],slots:[],counts:{ok:1,attention:0,ng:0},checks:[]};
                  return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
                }
                return route.continue();
              });
              await page.goto(`${base}/${file}?demo=1`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(900);
              const metrics=await page.evaluate(()=>{
                const visible=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'&&r.right>0&&r.left<window.innerWidth};
                const interactive=[...document.querySelectorAll('button,a,input,select,textarea')].filter(visible).map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,text:(e.textContent||e.getAttribute('aria-label')||e.getAttribute('placeholder')||'').trim().slice(0,50),left:r.left,right:r.right,width:r.width,height:r.height}});
                return {innerWidth:window.innerWidth,scrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth,interactive};
              });
              const clipped=metrics.interactive.filter(x=>x.left<-1||x.right>width+1||x.width<1||x.height<1);
              const panelMetrics=[];
              if(file==='owner.html'){
                const count=await page.locator('.nav-btn[data-panel]').count();
                for(let i=0;i<count;i++){
                  await page.locator('.nav-btn[data-panel]').nth(i).evaluate(el=>el.click());
                  await page.waitForTimeout(80);
                  const pm=await page.evaluate(()=>({panel:document.querySelector('.panel.active')?.id||'',scrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth}));
                  panelMetrics.push(pm);
                }
              }
              const panelsOk=panelMetrics.every(x=>x.scrollWidth<=width+1&&x.bodyScrollWidth<=width+1);
              const ok=metrics.scrollWidth<=width+1&&metrics.bodyScrollWidth<=width+1&&clipped.length===0&&panelsOk;
              await page.screenshot({path:`${out}/${key}.png`,fullPage:true});
              results.push({key,file,viewport:[width,height],ok,scrollWidth:metrics.scrollWidth,bodyScrollWidth:metrics.bodyScrollWidth,clipped,panelMetrics,jsErrors});
              await page.close();
            }
            await browser.close();
            const report={ok:results.every(x=>x.ok),results};
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa/estate-product-ready-r2/browser.json',JSON.stringify(report,null,2)+'\n');
            if(!report.ok){console.error(JSON.stringify(report,null,2));process.exit(1)}
          })();
          JS
          node /tmp/estate-browser/qa.js

      - name: Write R2 source and verification record
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, datetime
          record={
            'systemCode':'ESTATE',
            'remediation':'PRODUCT_READY_R2',
            'baselineSha':os.environ['BASELINE_SHA'],
            'frontendVersion':os.environ['EXPECTED_FRONTEND'],
            'adapterVersion':os.environ['EXPECTED_ADAPTER'],
            'databaseVersion':os.environ['EXPECTED_DATABASE'],
            'extensionWorkerVersion':os.environ['EXPECTED_EXTENSION'],
            'legacyWorkerVersion':os.environ['EXPECTED_LEGACY'],
            'gateway':os.environ['GATEWAY'],
            'legacySourceRecovered':False,
            'legacyIdentityPreserved':True,
            'integrationStatus':'deferred_until_contract',
            'standardChanged':False,
            'qa':{
              'runtime':'qa/estate-product-ready-r2/runtime.json',
              'browser':'qa/estate-product-ready-r2/browser.json',
              'a4Qr':'qa/estate-product-ready-r2/a4-qr.json'
            },
            'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('dpro-next/estate-product-ready-r2.json','w',encoding='utf-8').write(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit verified R2 source and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$WORKFLOW_FILE"
          git add config.js system-check.html system-check-product-ready-r2.js dpro-product-ready-adapter.json dpro-next/estate-product-ready-r2.json qa/estate-product-ready-r2 "$WORKFLOW_FILE"
          git diff --cached --quiet && { echo "No R2 changes to commit"; exit 1; }
          git commit -m "ESTATE Product READY R2 apply and QA [skip ci]"
          git push origin HEAD:main
