name: DPRO ESTATE NEXT-10 Contract Owner Separation R3

'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/estate-next-10-contract-owner-separation-r3.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dpro-estate-next-10-contract-owner-separation-r3
  cancel-in-progress: false

jobs:
  contract-owner-separation-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: main
      PAGE_BASE: https://dpromstk2000-lab.github.io/dpro-estate-line-liff
      LEGACY_API: https://dpro-estate-line-api.dpromstk2000.workers.dev
      BACKUP_TAG: dpro-estate-next-10-contract-owner-separation-before-20260725
      R1_WORKFLOW: .github/workflows/estate-next-10-contract-owner-separation-r1.yml
      R2_WORKFLOW: .github/workflows/estate-next-10-contract-owner-separation-r2.yml
      R3_WORKFLOW: .github/workflows/estate-next-10-contract-owner-separation-r3.yml

    steps:
      - name: Checkout repository with failed verification workflows
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify completed system and installed access separation
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s owner-settings.html
          test -s config.js
          test -s dpro-next/estate-progress.yml
          test -s dpro-next/estate-contract-owner-access.yml

          test "$(awk -F': ' '/^current_step:/{print $2;exit}' dpro-next/estate-progress.yml)" = 'ESTATE-NEXT-COMPLETE'
          test "$(awk -F': ' '/^complete:/{print $2;exit}' dpro-next/estate-progress.yml)" = 'true'

          grep -q 'ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R1' owner-settings.html
          grep -q 'data-settings-button="security"' owner-settings.html
          grep -q 'data-settings-button="demo"' owner-settings.html
          grep -q 'data-settings-panel="security"' owner-settings.html
          grep -q 'data-settings-panel="demo"' owner-settings.html
          grep -q "deploymentMode: window.DPRO_ESTATE_DEPLOYMENT_MODE || 'demo'" config.js
          grep -q "shopCode: window.DPRO_ESTATE_SHOP_CODE || 'dpro_estate_demo'" config.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          tag_commit="$(git rev-parse "$BACKUP_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
            echo 'ERROR: backup tag is not an ancestor of current main.'
            exit 1
          fi

          sha256sum owner-settings.html config.js > /tmp/access-separation-app-before.sha256
          echo 'Installed access separation and final completion ledger confirmed.'

      - name: Diagnose R1 and R2 verification-only failures
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY_DIAGNOSE'
          from pathlib import Path

          settings = Path('owner-settings.html').read_text(encoding='utf-8')
          r1_path = Path(
              '.github/workflows/estate-next-10-contract-owner-separation-r1.yml'
          )
          r2_path = Path(
              '.github/workflows/estate-next-10-contract-owner-separation-r2.yml'
          )

          if not r1_path.exists():
              raise SystemExit('ERROR: failed R1 workflow file was not found.')
          if not r2_path.exists():
              raise SystemExit('ERROR: failed R2 workflow file was not found.')

          r1 = r1_path.read_text(encoding='utf-8')
          r2 = r2_path.read_text(encoding='utf-8')

          application_rules = [
              "const state={adminCode:'',authenticated:false",
              "if(!state.demoEnvironment){toast('契約店舗ではデモ準備を実行できません。'",
              "if(path==='/api/admin/demo/prepare'&&!state.demoEnvironment)",
              "return requestedDemo&&CONFIG.shopCode===demoShopCode&&deploymentMode==='demo'",
          ]
          missing = [
              rule for rule in application_rules
              if rule not in settings
          ]
          if missing:
              raise SystemExit(
                  f'ERROR: installed application guards are missing: {missing}'
              )

          if 'window.state.authenticated = true' not in r1:
              raise SystemExit(
                  'ERROR: expected R1 verification defect was not found.'
              )

          if (
              ".replace('.', '。')" not in r2 or
              '契約店舗ではデモ準備を実行できません.' not in r2
          ):
              raise SystemExit(
                  'ERROR: expected R2 punctuation verification defect was not found.'
              )

          if 'window.state' in settings:
              raise SystemExit(
                  'ERROR: application state must remain private.'
              )

          print('R1 failure: verification referenced private window.state.')
          print('R2 failure: verification built Japanese punctuation dynamically.')
          print('Application defect: false.')
          print('R3 will verify literals, functions, and browser behavior.')
          PY_DIAGNOSE

      - name: Validate HTML JavaScript IDs config and access rules
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY_VALIDATE'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.inline_scripts = []
                  self.in_script = False
                  self.buffer = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'script' and 'src' not in attrs:
                      self.in_script = True
                      self.buffer = []

              def handle_data(self, data):
                  if self.in_script:
                      self.buffer.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_script:
                      self.inline_scripts.append(''.join(self.buffer))
                      self.in_script = False
                      self.buffer = []

          html_path = Path('owner-settings.html')
          config_path = Path('config.js')
          text = html_path.read_text(encoding='utf-8')
          config = config_path.read_text(encoding='utf-8')

          parser = Parser()
          parser.feed(text)

          duplicates = sorted({
              item for item in parser.ids
              if parser.ids.count(item) > 1
          })
          if duplicates:
              raise SystemExit(
                  f'ERROR: duplicate owner-settings IDs: {duplicates}'
              )

          combined = '\n'.join(parser.inline_scripts).strip()
          if not combined:
              raise SystemExit(
                  'ERROR: owner-settings inline JavaScript is missing.'
              )

          with tempfile.NamedTemporaryFile(
              'w',
              suffix='.js',
              encoding='utf-8',
              delete=False
          ) as handle:
              handle.write(combined)
              js_path = handle.name

          result = subprocess.run(
              ['node', '--check', js_path],
              capture_output=True,
              text=True
          )
          Path(js_path).unlink(missing_ok=True)
          if result.returncode:
              raise SystemExit(result.stderr)

          literal_rules = {
              'security_menu':
                  'data-settings-button="security"',
              'demo_menu':
                  'data-settings-button="demo"',
              'security_panel':
                  'data-settings-panel="security"',
              'demo_panel':
                  'data-settings-panel="demo"',
              'contract_rejection_message':
                  '契約店舗ではデモ準備を実行できません。',
              'security_label':
                  '管理・セキュリティ',
              'dpro_only_label':
                  'DPRO専用',
              'demo_only_marker':
                  'data-demo-only',
          }
          missing_literals = [
              name for name, value in literal_rules.items()
              if value not in text
          ]
          if missing_literals:
              raise SystemExit(
                  f'ERROR: literal rules missing: {missing_literals}'
              )

          compact = re.sub(r'\s+', '', combined)
          function_rules = {
              'three_condition_demo_guard':
                  "returnrequestedDemo&&CONFIG.shopCode===demoShopCode&&deploymentMode==='demo';",
              'direct_panel_guard':
                  "if(name==='demo'&&!state.demoEnvironment)",
              'api_guard':
                  "if(path==='/api/admin/demo/prepare'&&!state.demoEnvironment)",
              'prepare_guard':
                  "asyncfunctionprepareDemo(){if(!state.demoEnvironment)",
          }
          missing_functions = [
              name for name, value in function_rules.items()
              if value not in compact
          ]
          if missing_functions:
              raise SystemExit(
                  f'ERROR: function guards missing: {missing_functions}'
              )

          config_rules = [
              "deploymentMode: window.DPRO_ESTATE_DEPLOYMENT_MODE || 'demo'",
              "shopCode: window.DPRO_ESTATE_SHOP_CODE || 'dpro_estate_demo'",
              "shopCode: 'dpro_estate_demo'",
          ]
          missing_config = [
              value for value in config_rules
              if value not in config
          ]
          if missing_config:
              raise SystemExit(
                  f'ERROR: config rules missing: {missing_config}'
              )

          forbidden_rules = [
              'data-settings-button="system"',
              'data-settings-panel="system"',
          ]
          forbidden_found = [
              value for value in forbidden_rules
              if value in text
          ]
          if forbidden_found:
              raise SystemExit(
                  f'ERROR: old mixed system structure remains: {forbidden_found}'
              )

          if 'window.state' in text:
              raise SystemExit(
                  'ERROR: application state was exposed on window.'
              )

          print('HTML parse: PASS')
          print('Duplicate IDs: PASS')
          print('JavaScript syntax: PASS')
          print('Literal access rules: PASS')
          print('Function access guards: PASS')
          print('Deployment config: PASS')
          print('Old mixed system structure removed: PASS')
          PY_VALIDATE

          node --check config.js

      - name: Confirm published access-separated settings page
        shell: bash
        run: |
          set -Eeuo pipefail

          published=0
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error \
              "$PAGE_BASE/owner-settings.html?demo=1&v=contract-owner-r3-${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/settings-live.html || true

            if grep -q 'ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R1' /tmp/settings-live.html 2>/dev/null; then
              published=1
              break
            fi
            sleep 10
          done

          if [ "$published" != '1' ]; then
            echo 'ERROR: access-separated settings page is not published.'
            exit 1
          fi

          grep -q '管理・セキュリティ' /tmp/settings-live.html
          grep -q 'DPRO専用' /tmp/settings-live.html
          grep -q '契約店舗ではデモ準備を実行できません。' /tmp/settings-live.html

          echo 'Published access-separated page confirmed.'

      - name: Run demo and contract browser behavior tests
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install --no-save --no-package-lock playwright-core@1.52.0 >/dev/null 2>&1

          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser_path" ]; then
            echo 'ERROR: system Chromium browser was not found.'
            exit 1
          fi

          mkdir -p /tmp/contract-owner-separation-r3

          BROWSER_PATH="$browser_path" PAGE_BASE="$PAGE_BASE" node <<'JS_BROWSER'
          const { chromium } = require('playwright-core');
          const fs = require('fs');

          const executablePath = process.env.BROWSER_PATH;
          const pageBase = process.env.PAGE_BASE;

          async function mockSettings(page) {
            await page.route('**/api/admin/settings**', async route => {
              if (route.request().method() === 'GET') {
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify({
                    ok: true,
                    shop: {
                      shop_name: '契約店舗テスト',
                      phone: '0920000000',
                      address: '福岡県',
                      area_title: '希望エリア',
                      business_start_time: '10:00',
                      business_end_time: '18:00',
                      slot_minutes: 30,
                      booking_days_ahead: 60,
                      regular_holidays: [],
                      max_viewings_per_day: 8,
                      max_reservations_per_slot: 1,
                      same_day_booking_cutoff_time: '09:00',
                      cancel_deadline_hours: 24
                    },
                    areas: [],
                    message_templates: []
                  })
                });
                return;
              }

              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ ok: true })
              });
            });
          }

          async function inspectDemo(browser) {
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 }
            });

            await page.addInitScript(() => localStorage.clear());
            await mockSettings(page);

            await page.goto(
              `${pageBase}/owner-settings.html?demo=1&v=contract-owner-r3-${Date.now()}`,
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            const initial = await page.evaluate(() => ({
              mode: document.documentElement.dataset.deploymentMode,
              demoNavHidden:
                document.getElementById('demoSystemNav')
                  .classList.contains('hidden'),
              demoPanelHidden:
                document.querySelector('[data-settings-panel="demo"]')
                  .classList.contains('hidden'),
              securityButtonExists:
                Boolean(
                  document.querySelector(
                    '[data-settings-button="security"]'
                  )
                )
            }));

            if (initial.mode !== 'demo') {
              throw new Error(
                `Demo mode not detected: ${JSON.stringify(initial)}`
              );
            }

            if (
              initial.demoNavHidden ||
              initial.demoPanelHidden ||
              !initial.securityButtonExists
            ) {
              throw new Error(
                `Demo controls unavailable: ${JSON.stringify(initial)}`
              );
            }

            await page.evaluate(() => window.openSettingsPanel('demo'));

            const activePanel = await page.evaluate(() =>
              document.querySelector('.settings-panel.active')
                ?.dataset.settingsPanel
            );

            if (activePanel !== 'demo') {
              throw new Error(
                `Demo panel did not open: ${activePanel}`
              );
            }

            await page.screenshot({
              path:
                '/tmp/contract-owner-separation-r3/demo-desktop.png',
              fullPage: true
            });

            await page.close();

            return {
              ...initial,
              activePanel
            };
          }

          async function inspectContract(
            browser,
            width,
            height,
            label
          ) {
            const page = await browser.newPage({
              viewport: { width, height }
            });

            await page.addInitScript(() => {
              localStorage.clear();
              window.DPRO_ESTATE_DEPLOYMENT_MODE = 'contract';
              window.DPRO_ESTATE_SHOP_CODE =
                'dpro_estate_contract_test';
              window.confirm = () => true;
            });

            await mockSettings(page);

            let demoPrepareRequests = 0;

            await page.route(
              '**/api/admin/demo/prepare**',
              async route => {
                demoPrepareRequests += 1;
                await route.fulfill({
                  status: 500,
                  contentType: 'application/json',
                  body: JSON.stringify({
                    ok: false,
                    error: 'This endpoint must not be reached.'
                  })
                });
              }
            );

            await page.goto(
              `${pageBase}/owner-settings.html?demo=1&v=contract-owner-r3-${Date.now()}`,
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            const initial = await page.evaluate(() => ({
              mode: document.documentElement.dataset.deploymentMode,
              demoNavHidden:
                document.getElementById('demoSystemNav')
                  .classList.contains('hidden'),
              demoPanelHidden:
                document.querySelector('[data-settings-panel="demo"]')
                  .classList.contains('hidden'),
              securityButtonExists:
                Boolean(
                  document.querySelector(
                    '[data-settings-button="security"]'
                  )
                )
            }));

            if (initial.mode !== 'contract') {
              throw new Error(
                `${label}: contract mode not detected: ${JSON.stringify(initial)}`
              );
            }

            if (
              !initial.demoNavHidden ||
              !initial.demoPanelHidden ||
              !initial.securityButtonExists
            ) {
              throw new Error(
                `${label}: contract visibility incorrect: ${JSON.stringify(initial)}`
              );
            }

            await page.evaluate(
              () => window.openSettingsPanel('demo')
            );

            const activeAfterDirectOpen = await page.evaluate(
              () =>
                document.querySelector('.settings-panel.active')
                  ?.dataset.settingsPanel
            );

            if (activeAfterDirectOpen === 'demo') {
              throw new Error(
                `${label}: direct demo panel opening was not blocked.`
              );
            }

            await page.evaluate(
              async () => await window.prepareDemo()
            );

            await page.waitForTimeout(250);

            if (demoPrepareRequests !== 0) {
              throw new Error(
                `${label}: prepareDemo sent ${demoPrepareRequests} API request(s).`
              );
            }

            const blockedMessage =
              await page.locator('#toast').textContent();

            if (
              !String(blockedMessage || '').includes(
                '契約店舗ではデモ準備を実行できません。'
              )
            ) {
              throw new Error(
                `${label}: rejection message missing: ${blockedMessage}`
              );
            }

            await page.evaluate(
              () => window.openSettingsPanel('security')
            );

            const securityVisible =
              await page.locator(
                '[data-settings-panel="security"]'
              ).isVisible();

            if (!securityVisible) {
              throw new Error(
                `${label}: security panel unavailable.`
              );
            }

            const horizontalOverflow =
              await page.evaluate(() =>
                Math.max(
                  0,
                  document.documentElement.scrollWidth -
                    window.innerWidth
                )
              );

            if (horizontalOverflow > 2) {
              throw new Error(
                `${label}: horizontal overflow ${horizontalOverflow}px`
              );
            }

            await page.screenshot({
              path:
                `/tmp/contract-owner-separation-r3/${label}.png`,
              fullPage: true
            });

            await page.close();

            return {
              ...initial,
              activeAfterDirectOpen,
              demoPrepareRequests,
              blockedMessage,
              securityVisible,
              horizontalOverflow
            };
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath,
              args: ['--no-sandbox']
            });

            try {
              const result = {
                demoDesktop:
                  await inspectDemo(browser),
                contractDesktop:
                  await inspectContract(
                    browser,
                    1440,
                    900,
                    'contract-desktop'
                  ),
                contractMobile:
                  await inspectContract(
                    browser,
                    390,
                    844,
                    'contract-mobile'
                  )
              };

              fs.writeFileSync(
                '/tmp/contract-owner-separation-r3/browser-result.json',
                JSON.stringify(result, null, 2)
              );

              console.log(
                JSON.stringify(result, null, 2)
              );
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS_BROWSER

      - name: Probe unknown contract shop non-destructively
        shell: bash
        run: |
          set -Eeuo pipefail

          probe_shop="contract_guard_probe_r3_${GITHUB_RUN_ID}"
          response_file=/tmp/contract-owner-separation-r3/server-probe-raw.txt

          http_status="$(curl --silent --show-error \
            --connect-timeout 15 \
            --max-time 35 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-Admin-Code: 1234' \
            --header 'X-DPRO-Admin-Code: 1234' \
            --data "{\"shop_code\":\"$probe_shop\",\"admin_code\":\"1234\",\"demo_mode\":true}" \
            "$LEGACY_API/api/admin/demo/prepare" || true)"

          PROBE_HTTP="$http_status" PROBE_FILE="$response_file" \
          python3 - <<'PY_PROBE'
          import json
          import os
          from pathlib import Path

          try:
              status = int(os.environ.get('PROBE_HTTP') or 0)
          except ValueError:
              status = 0

          raw_path = Path(os.environ['PROBE_FILE'])
          raw = (
              raw_path.read_text(
                  encoding='utf-8',
                  errors='replace'
              )
              if raw_path.exists()
              else ''
          )

          try:
              data = json.loads(raw) if raw else {}
          except Exception:
              data = {'parse_error': True}

          explicitly_accepted = (
              200 <= status < 300 and
              isinstance(data, dict) and
              data.get('ok') is True
          )

          if explicitly_accepted:
              raise SystemExit(
                  'ERROR: unknown contract shop passed demo preparation.'
              )

          result = {
              'http_status': status,
              'unknown_contract_shop_accepted': False,
              'server_probe_status':
                  'ATTENTION_NETWORK_UNAVAILABLE'
                  if status == 0
                  else 'PASS_NOT_ACCEPTED',
              'legacy_worker_source_in_repository': False,
              'valid_contract_shop_server_guard':
                  'ATTENTION_SOURCE_UNAVAILABLE'
          }

          Path(
              '/tmp/contract-owner-separation-r3/server-probe.json'
          ).write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ) + '\n',
              encoding='utf-8'
          )

          print(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY_PROBE

      - name: Confirm application files remained unchanged
        shell: bash
        run: |
          set -Eeuo pipefail

          sha256sum owner-settings.html config.js > /tmp/access-separation-app-after.sha256
          diff -u \
            /tmp/access-separation-app-before.sha256 \
            /tmp/access-separation-app-after.sha256

          echo 'Application files unchanged during R3 verification.'

      - name: Upload R3 browser and probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: estate-contract-owner-separation-r3
          path: /tmp/contract-owner-separation-r3
          retention-days: 30

      - name: Record R3 completion and preserve final system status
        shell: bash
        run: |
          set -Eeuo pipefail

          completed_at="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%:z')"

          cp \
            /tmp/contract-owner-separation-r3/browser-result.json \
            dpro-next/estate-contract-owner-browser-result.json

          cp \
            /tmp/contract-owner-separation-r3/server-probe.json \
            dpro-next/estate-contract-owner-server-probe.json

          cat > dpro-next/estate-hotfix-contract-owner-separation.yml <<EOF_RECORD
          system: DPRO 不動産・賃貸内見 LINE
          hotfix: ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R3
          status: COMPLETE_WITH_SERVER_ATTENTION
          completed_at_jst: "$completed_at"
          application_files_changed_in_r3: false
          r1_failure:
            application_defect: false
            verification_defect: WINDOW_STATE_REFERENCE
          r2_failure:
            application_defect: false
            verification_defect: FRAGILE_PUNCTUATION_STRING
          r3_verification:
            literal_source_checks: PASS
            function_guard_checks: PASS
            browser_behavior_checks: PASS
          demo_visibility_condition:
            query_demo_equals_1: PASS
            demo_shop_code_match: PASS
            deployment_mode_demo: PASS
            all_conditions_required: PASS
          contract_owner_demo_menu_hidden: PASS
          contract_owner_demo_panel_hidden: PASS
          contract_owner_direct_panel_open_blocked: PASS
          contract_owner_prepare_demo_client_blocked: PASS
          contract_owner_demo_api_request_count: 0
          contract_owner_security_panel_visible: PASS
          demo_environment_controls_visible: PASS
          desktop_visual_check: PASS
          mobile_visual_check: PASS
          legacy_worker_source_in_repository: false
          valid_contract_shop_server_guard: ATTENTION_SOURCE_UNAVAILABLE
          worker_changed: false
          supabase_changed: false
          api_changed: false
          existing_features_preserved: true
          EOF_RECORD

          python3 - <<'PY_PROGRESS'
          from pathlib import Path

          path = Path('dpro-next/estate-progress.yml')
          text = path.read_text(encoding='utf-8')

          required = [
              'current_step: ESTATE-NEXT-COMPLETE',
              'next_step: NONE',
              'complete: true',
          ]
          missing = [
              item for item in required
              if item not in text
          ]
          if missing:
              raise SystemExit(
                  f'ERROR: final completion ledger changed: {missing}'
              )

          updates = {
              'post_complete_access_hotfix':
                  'ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R3',
              'contract_owner_demo_menu':
                  'HIDDEN',
              'contract_owner_demo_prepare':
                  'BLOCKED_CLIENT_SIDE',
              'contract_owner_demo_api_requests':
                  '0',
              'contract_owner_security_panel':
                  'PASS',
              'demo_access_condition':
                  'DEMO_QUERY_AND_DEMO_SHOP_AND_DEMO_MODE',
              'demo_server_guard':
                  'ATTENTION_LEGACY_SOURCE_UNAVAILABLE',
          }

          lines = text.rstrip().splitlines()
          positions = {
              line.split(':', 1)[0].strip(): index
              for index, line in enumerate(lines)
              if ':' in line
          }

          for key, value in updates.items():
              line = f'{key}: {value}'
              if key in positions:
                  lines[positions[key]] = line
              else:
                  lines.append(line)

          path.write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8'
          )
          PY_PROGRESS

          git add \
            dpro-next/estate-progress.yml \
            dpro-next/estate-hotfix-contract-owner-separation.yml \
            dpro-next/estate-contract-owner-browser-result.json \
            dpro-next/estate-contract-owner-server-probe.json

          git commit -m 'Verify DPRO ESTATE contract owner separation R3'
          git push origin "$TARGET_BRANCH"

      - name: Delete failed R1 R2 and completed R3 workflows
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f \
            "$R1_WORKFLOW" \
            "$R2_WORKFLOW" \
            "$R3_WORKFLOW"

          git add -A \
            "$R1_WORKFLOW" \
            "$R2_WORKFLOW" \
            "$R3_WORKFLOW"

          if ! git diff --cached --quiet; then
            git commit -m 'Remove completed DPRO ESTATE access workflows'
            git push origin "$TARGET_BRANCH"
          fi

