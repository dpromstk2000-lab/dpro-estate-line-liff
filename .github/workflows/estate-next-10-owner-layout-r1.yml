name: DPRO ESTATE NEXT-10 Hotfix Owner Layout R1

'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/estate-next-10-owner-layout-r1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dpro-estate-next-10-owner-layout-r1
  cancel-in-progress: false

jobs:
  owner-layout-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: main
      WORKFLOW_PATH: .github/workflows/estate-next-10-owner-layout-r1.yml
      STALE_AUTH_WORKFLOW: .github/workflows/estate-next-10-followup-auth-r1.yml
      PAGE_BASE: https://dpromstk2000-lab.github.io/dpro-estate-line-liff
      BACKUP_TAG: dpro-estate-next-10-owner-layout-before-20260725

    steps:
      - name: Checkout completed repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify completion ledger and protect current version
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s dpro-next/estate-progress.yml
          test "$(awk -F': ' '/^current_step:/{print $2;exit}' dpro-next/estate-progress.yml)" = 'ESTATE-NEXT-COMPLETE'
          test "$(awk -F': ' '/^complete:/{print $2;exit}' dpro-next/estate-progress.yml)" = 'true'
          test -s owner.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git rev-parse "$BACKUP_TAG^{commit}" >/dev/null 2>&1; then
            tag_commit="$(git rev-parse "$BACKUP_TAG^{commit}")"
            if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
              echo 'ERROR: existing owner-layout backup tag is not an ancestor of main.'
              exit 1
            fi
            echo "Reusing backup tag: $BACKUP_TAG -> $tag_commit"
          else
            base_commit="$(git rev-parse HEAD^)"
            git tag -a "$BACKUP_TAG" "$base_commit" -m 'DPRO ESTATE completed version before owner layout hotfix'
            git push origin "$BACKUP_TAG"
          fi

      - name: Confirm shared owner layout defect and existing features
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY_GUARD'
          from pathlib import Path

          text = Path('owner.html').read_text(encoding='utf-8')

          required = [
              '.task-grid{display:grid',
              '.list{display:grid',
              '.actions{display:flex',
              '.small-btn{border:',
              'function reservationCardHtml',
              'function customerCardHtml',
              'function propertyManageCardHtml',
              'data-panel="today"',
              'data-panel="reservations"',
              'data-panel="customers"',
              'data-panel="properties"',
              'data-panel="cases"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: owner features required for the shared layout fix are missing: {missing}')

          if 'ESTATE-NEXT-10-HOTFIX-OWNER-LAYOUT-R1' in text:
              raise SystemExit('ERROR: owner layout R1 marker already exists.')

          print('Shared owner card/action layout confirmed.')
          print('Today, reservations, customers, properties and cases are in the common owner page.')
          PY_GUARD

      - name: Install shared owner card and action layout fix
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY_PATCH'
          from pathlib import Path

          path = Path('owner.html')
          text = path.read_text(encoding='utf-8')

          css = r'''
              /* ESTATE-NEXT-10-HOTFIX-OWNER-LAYOUT-R1 / 20260725 */
              .task-grid,
              .list,
              .cards,
              .case-list{
                align-items:start;
                align-content:start;
              }

              .task-grid > *,
              .list > *,
              .cards > *,
              .case-list > *{
                min-width:0;
                align-self:start;
              }

              .item,
              .person-card,
              .property-card,
              .case-card{
                width:100%;
                height:auto;
                min-height:0;
                align-self:start;
              }

              .actions{
                display:flex;
                align-items:center;
                align-content:flex-start;
                justify-content:flex-start;
                gap:7px;
                flex-wrap:wrap;
                width:100%;
                height:auto;
                min-height:0;
                margin-top:10px;
              }

              .small-btn{
                display:inline-flex;
                align-items:center;
                justify-content:center;
                flex:0 0 auto;
                width:auto;
                height:auto;
                min-height:34px;
                max-height:none;
                padding:7px 11px;
                line-height:1.25;
                white-space:nowrap;
                writing-mode:horizontal-tb;
                text-orientation:mixed;
                overflow:visible;
              }

              @media(max-width:560px){
                .actions{
                  display:grid;
                  grid-template-columns:repeat(2,minmax(0,1fr));
                  align-items:start;
                }

                .small-btn{
                  width:100%;
                  min-width:0;
                  white-space:normal;
                }
              }
          '''

          if '</style>' not in text:
              raise SystemExit('ERROR: owner.html closing style tag was not found.')

          text = text.replace('</style>', css + '\n  </style>', 1)
          text = text.replace(
              '<!-- DPRO ESTATE NEXT-8 / owner.html -->',
              '<!-- DPRO ESTATE NEXT-10 / owner.html -->',
              1
          )
          text = text.replace(
              "const version = 'estate-next-8';",
              "const version = 'estate-next-10-owner-layout-r1';",
              1
          )
          text = text.replace(
              'followup.html?v=estate-next-8',
              'followup.html?v=estate-next-10-followup-auth-r2'
          )

          path.write_text(text, encoding='utf-8')
          print('Shared owner layout hotfix installed.')
          PY_PATCH

      - name: Validate HTML JavaScript IDs and fixed CSS rules
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -q 'ESTATE-NEXT-10-HOTFIX-OWNER-LAYOUT-R1' owner.html
          grep -q 'writing-mode:horizontal-tb' owner.html
          grep -q 'flex:0 0 auto' owner.html
          grep -q 'align-content:flex-start' owner.html
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' owner.html

          python3 - <<'PY_VALIDATE'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class OwnerParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.inline_scripts = []
                  self.in_script = False
                  self.buffer = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'script' and 'src' not in attrs:
                      self.in_script = True
                      self.buffer = []

              def handle_data(self, data):
                  if self.in_script:
                      self.buffer.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_script:
                      self.inline_scripts.append(''.join(self.buffer))
                      self.in_script = False
                      self.buffer = []

          text = Path('owner.html').read_text(encoding='utf-8')
          parser = OwnerParser()
          parser.feed(text)

          duplicate_ids = sorted({
              item for item in parser.ids
              if parser.ids.count(item) > 1
          })
          if duplicate_ids:
              raise SystemExit(f'ERROR: duplicate owner HTML IDs: {duplicate_ids}')

          combined = '\n'.join(parser.inline_scripts).strip()
          if not combined:
              raise SystemExit('ERROR: owner inline JavaScript was not found.')

          with tempfile.NamedTemporaryFile(
              'w',
              suffix='.js',
              encoding='utf-8',
              delete=False
          ) as handle:
              handle.write(combined)
              js_path = handle.name

          result = subprocess.run(
              ['node', '--check', js_path],
              capture_output=True,
              text=True
          )
          Path(js_path).unlink(missing_ok=True)
          if result.returncode:
              raise SystemExit(result.stderr)

          for panel in ['today', 'reservations', 'customers', 'properties', 'cases', 'messages']:
              if f'data-panel="{panel}"' not in text:
                  raise SystemExit(f'ERROR: owner panel disappeared: {panel}')

          for feature in [
              'reservationCardHtml',
              'customerCardHtml',
              'propertyManageCardHtml',
              'renderCases',
              'この端末の管理コードを削除',
          ]:
              if feature not in text:
                  raise SystemExit(f'ERROR: existing owner feature disappeared: {feature}')

          print('Owner HTML IDs: PASS')
          print('Owner JavaScript syntax: PASS')
          print('Existing owner panels and features: PASS')
          PY_VALIDATE

      - name: Commit owner layout hotfix
        shell: bash
        run: |
          set -Eeuo pipefail

          git add owner.html
          if git diff --cached --quiet; then
            echo 'ERROR: owner.html was not changed.'
            exit 1
          fi

          git commit -m 'Fix DPRO ESTATE owner card action layout'
          git push origin "$TARGET_BRANCH"

      - name: Wait for GitHub Pages publication
        shell: bash
        run: |
          set -Eeuo pipefail

          published=0
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error \
              "$PAGE_BASE/owner.html?demo=1&v=owner-layout-r1-${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/owner-live.html || true

            if grep -q 'ESTATE-NEXT-10-HOTFIX-OWNER-LAYOUT-R1' /tmp/owner-live.html 2>/dev/null; then
              published=1
              break
            fi
            sleep 10
          done

          if [ "$published" != '1' ]; then
            echo 'ERROR: updated owner.html was not published in time.'
            exit 1
          fi

          grep -q 'writing-mode:horizontal-tb' /tmp/owner-live.html
          grep -q 'flex:0 0 auto' /tmp/owner-live.html
          echo 'Published owner layout hotfix confirmed.'

      - name: Run desktop tablet and mobile owner visual checks
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install --no-save --no-package-lock playwright-core@1.52.0 >/dev/null 2>&1

          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser_path" ]; then
            echo 'ERROR: a system Chromium browser was not found.'
            exit 1
          fi

          mkdir -p /tmp/owner-layout-artifact

          BROWSER_PATH="$browser_path" PAGE_BASE="$PAGE_BASE" node <<'JS_VISUAL'
          const { chromium } = require('playwright-core');
          const fs = require('fs');

          const pageBase = process.env.PAGE_BASE;
          const executablePath = process.env.BROWSER_PATH;

          async function inspectViewport(browser, width, height, label) {
            const page = await browser.newPage({
              viewport: { width, height },
              deviceScaleFactor: 1
            });

            const url = `${pageBase}/owner.html?demo=1&v=owner-layout-r1-${Date.now()}`;
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1200);

            const authCard = page.locator('#authCard');
            if (await authCard.isVisible()) {
              const input = page.locator('#adminCodeInput');
              if (!(await input.inputValue())) {
                await input.fill('1234');
              }
              await page.locator('#loginBtn').click();
            }

            await page.waitForFunction(
              () => document.getElementById('authCard')?.classList.contains('hidden'),
              null,
              { timeout: 30000 }
            );

            const panelResults = {};
            const panels = ['today', 'reservations', 'customers', 'properties', 'cases'];

            for (const panel of panels) {
              await page.evaluate(name => window.openPanel(name), panel);
              await page.waitForTimeout(900);

              const measurement = await page.evaluate(() => {
                const buttons = [...document.querySelectorAll(
                  '.panel.active .small-btn'
                )].map(button => {
                  const rect = button.getBoundingClientRect();
                  const style = getComputedStyle(button);
                  return {
                    text: button.textContent.trim(),
                    width: Math.round(rect.width * 10) / 10,
                    height: Math.round(rect.height * 10) / 10,
                    writingMode: style.writingMode,
                    flex: style.flex,
                    display: style.display
                  };
                });

                const cards = [...document.querySelectorAll(
                  '.panel.active .item, .panel.active .person-card, .panel.active .property-card, .panel.active .case-card'
                )].map(card => {
                  const rect = card.getBoundingClientRect();
                  return {
                    width: Math.round(rect.width * 10) / 10,
                    height: Math.round(rect.height * 10) / 10
                  };
                });

                return {
                  buttons,
                  cards,
                  scrollWidth: document.documentElement.scrollWidth,
                  innerWidth: window.innerWidth
                };
              });

              const badButtons = measurement.buttons.filter(button =>
                button.height > 64 ||
                button.height < 24 ||
                button.writingMode !== 'horizontal-tb'
              );

              if (badButtons.length) {
                throw new Error(
                  `${label}/${panel}: abnormal action buttons ${JSON.stringify(badButtons)}`
                );
              }

              if (measurement.scrollWidth > measurement.innerWidth + 2) {
                throw new Error(
                  `${label}/${panel}: horizontal overflow ${measurement.scrollWidth - measurement.innerWidth}px`
                );
              }

              panelResults[panel] = {
                buttonCount: measurement.buttons.length,
                maximumButtonHeight: measurement.buttons.length
                  ? Math.max(...measurement.buttons.map(button => button.height))
                  : 0,
                maximumCardHeight: measurement.cards.length
                  ? Math.max(...measurement.cards.map(card => card.height))
                  : 0,
                horizontalOverflow: Math.max(
                  0,
                  measurement.scrollWidth - measurement.innerWidth
                )
              };
            }

            await page.evaluate(() => window.openPanel('today'));
            await page.waitForTimeout(500);
            await page.screenshot({
              path: `/tmp/owner-layout-artifact/${label}.png`,
              fullPage: true
            });

            await page.close();
            return panelResults;
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath,
              args: ['--no-sandbox']
            });

            try {
              const result = {
                desktop1440: await inspectViewport(browser, 1440, 900, 'desktop-1440'),
                tablet1024: await inspectViewport(browser, 1024, 900, 'tablet-1024'),
                mobile390: await inspectViewport(browser, 390, 844, 'mobile-390')
              };

              fs.writeFileSync(
                '/tmp/owner-layout-artifact/owner-layout-result.json',
                JSON.stringify(result, null, 2)
              );
              console.log(JSON.stringify(result, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS_VISUAL

      - name: Upload owner layout visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: estate-owner-layout-r1
          path: /tmp/owner-layout-artifact
          retention-days: 30

      - name: Record completed-system owner layout hotfix
        shell: bash
        run: |
          set -Eeuo pipefail

          completed_at="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%:z')"
          cp /tmp/owner-layout-artifact/owner-layout-result.json \
            dpro-next/estate-owner-layout-r1-result.json

          cat > dpro-next/estate-hotfix-owner-layout.yml <<EOF_HOTFIX
          system: DPRO 不動産・賃貸内見 LINE
          hotfix: ESTATE-NEXT-10-HOTFIX-OWNER-LAYOUT-R1
          status: COMPLETE
          completed_at_jst: "$completed_at"
          defect: shared owner card action buttons stretched vertically
          resolution: explicit grid alignment and horizontal fixed-height action controls
          affected_panels:
            - today
            - reservations
            - customers
            - properties
            - cases
          desktop_1440_visual_check: PASS
          tablet_1024_visual_check: PASS
          mobile_390_visual_check: PASS
          action_button_height_check: PASS
          horizontal_overflow_check: PASS
          existing_features_preserved: true
          worker_changed: false
          supabase_changed: false
          api_changed: false
          EOF_HOTFIX

          python3 - <<'PY_PROGRESS'
          from pathlib import Path

          path = Path('dpro-next/estate-progress.yml')
          text = path.read_text(encoding='utf-8')

          required = [
              'current_step: ESTATE-NEXT-COMPLETE',
              'next_step: NONE',
              'complete: true',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: final completion ledger changed unexpectedly: {missing}')

          updates = {
              'post_complete_ui_hotfix': 'ESTATE-NEXT-10-HOTFIX-OWNER-LAYOUT-R1',
              'owner_layout': 'PASS',
              'owner_action_buttons': 'PASS',
              'owner_visual_verification': 'DESKTOP_TABLET_MOBILE',
          }

          lines = text.rstrip().splitlines()
          positions = {
              line.split(':', 1)[0].strip(): index
              for index, line in enumerate(lines)
              if ':' in line
          }

          for key, value in updates.items():
              line = f'{key}: {value}'
              if key in positions:
                  lines[positions[key]] = line
              else:
                  lines.append(line)

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY_PROGRESS

          git add \
            dpro-next/estate-progress.yml \
            dpro-next/estate-hotfix-owner-layout.yml \
            dpro-next/estate-owner-layout-r1-result.json

          git commit -m 'Record DPRO ESTATE owner layout hotfix'
          git push origin "$TARGET_BRANCH"

      - name: Delete completed and stale hotfix workflows
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$WORKFLOW_PATH" "$STALE_AUTH_WORKFLOW"
          git add -A "$WORKFLOW_PATH" "$STALE_AUTH_WORKFLOW"

          if ! git diff --cached --quiet; then
            git commit -m 'Remove completed DPRO ESTATE hotfix workflows'
            git push origin "$TARGET_BRANCH"
          fi

      - name: Publish owner layout hotfix summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF_SUMMARY'
          # DPRO ESTATE OWNER LAYOUT HOTFIX COMPLETE

          | 項目 | 結果 |
          |---|---|
          | 今日やること | PASS |
          | 内見予約 | PASS |
          | 顧客カルテ | PASS |
          | 物件管理 | PASS |
          | 案件進捗 | PASS |
          | 操作ボタン縦伸び | 解消 |
          | Desktop 1440px | PASS |
          | Tablet 1024px | PASS |
          | Mobile 390px | PASS |
          | 横スクロール | なし |
          | Worker変更 | なし |
          | Supabase変更 | なし |
          | 完成台帳 | ESTATE-NEXT-COMPLETEを維持 |

          公開確認:
          https://dpromstk2000-lab.github.io/dpro-estate-line-liff/owner.html?demo=1&v=owner-layout-r1
          EOF_SUMMARY
