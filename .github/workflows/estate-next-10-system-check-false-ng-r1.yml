name: DPRO ESTATE NEXT-10 System Check False NG R1
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/estate-next-10-system-check-false-ng-r1.yml
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: dpro-estate-next-10-system-check-false-ng-r1
  cancel-in-progress: false
jobs:
  system-check-false-ng-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: main
      WORKFLOW_PATH: .github/workflows/estate-next-10-system-check-false-ng-r1.yml
      PAGE_BASE: https://dpromstk2000-lab.github.io/dpro-estate-line-liff
      BACKUP_TAG: dpro-estate-next-10-system-check-false-ng-before-20260725
    steps:
    - name: Checkout completed repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: main
    - name: Verify completed system and create backup
      shell: bash
      run: "set -Eeuo pipefail\ntest -s system-check.html\ntest -s system-check-api.js\ntest -s dpro-next/estate-progress.yml\ntest \"$(awk -F': ' '/^current_step:/{print $2;exit}' dpro-next/estate-progress.yml)\" = 'ESTATE-NEXT-COMPLETE'\ntest \"$(awk -F': ' '/^complete:/{print $2;exit}' dpro-next/estate-progress.yml)\" = 'true'\n\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\nif git rev-parse \"$BACKUP_TAG^{commit}\" >/dev/null 2>&1; then\n  tag_commit=\"$(git rev-parse \"$BACKUP_TAG^{commit}\")\"\n  git merge-base --is-ancestor \"$tag_commit\" HEAD\nelse\n  git tag -a \"$BACKUP_TAG\" HEAD -m 'Before ESTATE system-check false NG correction'\n  git push origin \"$BACKUP_TAG\"\nfi"
    - name: Guard exact false NG condition
      shell: bash
      run: "set -Eeuo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\n\napi = Path('system-check-api.js').read_text(encoding='utf-8')\npage = Path('system-check.html').read_text(encoding='utf-8')\n\nrequired = [\n    \"write_test=0\",\n    \"const followup = system.data.followup_test || {};\",\n    \"followupOk ? STATUS.OK : STATUS.NG\",\n    \"const member = system.data.member_security_test || {};\",\n    \"member.ok === true && member.token_hash_only === true ? STATUS.OK : STATUS.NG\",\n]\nmissing = [item for item in required if item not in api]\nif missing:\n    raise SystemExit(f'ERROR: expected false-NG structure changed: {missing}')\n\nif 'ESTATE-NEXT-10-SYSTEM-CHECK-FALSE-NG-R1' in api:\n    raise SystemExit('ERROR: false-NG R1 is already installed.')\n\nif 'system-check-api.js?v=estate-next-9' not in page:\n    raise SystemExit('ERROR: system-check cache version changed.')\n\nprint('Current false-NG condition confirmed.')\nPY"
    - name: Correct unexecuted write tests from NG to attention
      shell: bash
      run: "set -Eeuo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\nimport base64\n\nold = base64.b64decode('').decode('utf-8')\n\
        new = base64.b64decode('').decode('utf-8')\n\
        \napi_path = Path('system-check-api.js')\napi = api_path.read_text(encoding='utf-8')\nif old not in api:\n    raise SystemExit('ERROR: false-NG replacement target was not found.')\n\napi = api.replace(old, new, 1)\napi = api.replace(\n    \"(function () {\",\n    \"/* ESTATE-NEXT-10-SYSTEM-CHECK-FALSE-NG-R1 */\\n(function () {\",\n    1\n)\napi_path.write_text(api, encoding='utf-8')\n\npage_path = Path('system-check.html')\npage = page_path.read_text(encoding='utf-8')\nold_version = 'system-check-api.js?v=estate-next-9'\nnew_version = 'system-check-api.js?v=estate-next-10-false-ng-r1'\nif old_version not in page:\n    raise SystemExit('ERROR: cache version replacement target was not found.')\npage_path.write_text(\n    page.replace(old_version, new_version, 1),\n    encoding='utf-8'\n)\n\nprint('False NG correction installed.')\nPY"
    - name: Validate JavaScript HTML and decision branches
      shell: bash
      run: "set -Eeuo pipefail\nnode --check system-check-api.js\n\npython3 - <<'PY'\nfrom html.parser import HTMLParser\nfrom pathlib import Path\n\nclass Parser(HTMLParser):\n    def __init__(self):\n        super().__init__()\n        self.ids = []\n    def handle_starttag(self, tag, attrs):\n        attrs = dict(attrs)\n        if 'id' in attrs:\n            self.ids.append(attrs['id'])\n\npage = Path('system-check.html').read_text(encoding='utf-8')\napi = Path('system-check-api.js').read_text(encoding='utf-8')\n\nparser = Parser()\nparser.feed(page)\nduplicates = sorted({\n    item for item in parser.ids\n    if parser.ids.count(item) > 1\n})\nif duplicates:\n    raise SystemExit(f'ERROR: duplicate IDs: {duplicates}')\n\nrequired = [\n    'ESTATE-NEXT-10-SYSTEM-CHECK-FALSE-NG-R1',\n    'const followupExecuted =',\n    'followupExecuted ? (followupOk ? STATUS.OK : STATUS.NG) : STATUS.ATTENTION',\n    'const memberExecuted =',\n    'memberExecuted ? (memberOk ? STATUS.OK : STATUS.NG)\
        \ : STATUS.ATTENTION',\n    '読取専用チェック（write_test=0）のため、書込みを伴う二重操作テストは未実施です。',\n    '読取専用チェック（write_test=0）のため、セッション生成を伴う保護テストは未実施です。',\n]\nmissing = [item for item in required if item not in api]\nif missing:\n    raise SystemExit(f'ERROR: corrected branches missing: {missing}')\n\nif 'system-check-api.js?v=estate-next-10-false-ng-r1' not in page:\n    raise SystemExit('ERROR: cache-busting version was not updated.')\n\nprint('JavaScript syntax: PASS')\nprint('HTML duplicate IDs: PASS')\nprint('Unexecuted tests => ATTENTION: PASS')\nprint('Executed failed tests => NG preserved: PASS')\nPY"
    - name: Run isolated decision tests
      shell: bash
      run: "set -Eeuo pipefail\nnode <<'JS'\nconst STATUS = { OK: 'OK', ATTENTION: '注意', NG: 'NG' };\n\nfunction followupStatus(followup) {\n  const keys = [\n    'task_duplicate_guard',\n    'proposal_duplicate_guard',\n    'exclusion_duplicate_guard',\n    'revisit_duplicate_guard',\n    'candidate_match_logic'\n  ];\n  const executed = keys.some(\n    key => Object.prototype.hasOwnProperty.call(followup, key)\n  );\n  const ok = executed && keys.every(key => followup[key] === true);\n  return executed ? (ok ? STATUS.OK : STATUS.NG) : STATUS.ATTENTION;\n}\n\nfunction memberStatus(member) {\n  const executed = [\n    'ok',\n    'token_hash_only',\n    'expiry_guard',\n    'revisit_guard'\n  ].some(\n    key => Object.prototype.hasOwnProperty.call(member, key)\n  );\n  const ok =\n    executed &&\n    member.ok === true &&\n    member.token_hash_only === true;\n  return executed ? (ok ? STATUS.OK : STATUS.NG) : STATUS.ATTENTION;\n}\n\nconst cases = [\n  ['empty followup', followupStatus({}),\
        \ STATUS.ATTENTION],\n  ['passing followup', followupStatus({\n    task_duplicate_guard: true,\n    proposal_duplicate_guard: true,\n    exclusion_duplicate_guard: true,\n    revisit_duplicate_guard: true,\n    candidate_match_logic: true\n  }), STATUS.OK],\n  ['failing followup', followupStatus({\n    task_duplicate_guard: false,\n    proposal_duplicate_guard: true,\n    exclusion_duplicate_guard: true,\n    revisit_duplicate_guard: true,\n    candidate_match_logic: true\n  }), STATUS.NG],\n  ['empty member', memberStatus({}), STATUS.ATTENTION],\n  ['passing member', memberStatus({\n    ok: true,\n    token_hash_only: true\n  }), STATUS.OK],\n  ['failing member', memberStatus({\n    ok: false,\n    token_hash_only: true\n  }), STATUS.NG],\n];\n\nfor (const [name, actual, expected] of cases) {\n  if (actual !== expected) {\n    throw new Error(`${name}: expected ${expected}, received ${actual}`);\n  }\n  console.log(`${name}: ${actual}`);\n}\nJS"
    - name: Commit system-check correction
      shell: bash
      run: "set -Eeuo pipefail\ngit add system-check-api.js system-check.html\nif git diff --cached --quiet; then\n  echo 'ERROR: system-check correction made no changes.'\n  exit 1\nfi\ngit commit -m 'Correct ESTATE system-check false NG results'\ngit push origin \"$TARGET_BRANCH\""
    - name: Wait for GitHub Pages publication
      shell: bash
      run: "set -Eeuo pipefail\npublished=0\nfor attempt in $(seq 1 30); do\n  curl --fail --silent --show-error     \"$PAGE_BASE/system-check-api.js?v=false-ng-r1-${GITHUB_RUN_ID}-${attempt}\"     -o /tmp/system-check-api-live.js || true\n  if grep -q 'ESTATE-NEXT-10-SYSTEM-CHECK-FALSE-NG-R1' /tmp/system-check-api-live.js 2>/dev/null; then\n    published=1\n    break\n  fi\n  sleep 10\ndone\nif [ \"$published\" != '1' ]; then\n  echo 'ERROR: corrected system-check-api.js was not published.'\n  exit 1\nfi"
    - name: Run live demo system-check browser verification
      shell: bash
      run: "set -Eeuo pipefail\nnpm install --no-save --no-package-lock playwright-core@1.52.0 >/dev/null 2>&1\nbrowser_path=\"$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)\"\nif [ -z \"$browser_path\" ]; then\n  echo 'ERROR: system Chromium browser was not found.'\n  exit 1\nfi\n\nmkdir -p /tmp/system-check-false-ng-r1\n\nBROWSER_PATH=\"$browser_path\" PAGE_BASE=\"$PAGE_BASE\" node <<'JS'\nconst { chromium } = require('playwright-core');\nconst fs = require('fs');\n\n(async () => {\n  const browser = await chromium.launch({\n    headless: true,\n    executablePath: process.env.BROWSER_PATH,\n    args: ['--no-sandbox']\n  });\n\n  try {\n    const page = await browser.newPage({\n      viewport: { width: 1440, height: 1000 }\n    });\n\n    await page.goto(\n      `${process.env.PAGE_BASE}/system-check.html?demo=1&v=false-ng-r1-${Date.now()}`,\n      { waitUntil: 'networkidle', timeout: 60000 }\n    );\n\n    await\
        \ page.locator('#runButton').click();\n\n    await page.waitForFunction(() => {\n      const text =\n        document.getElementById('overallStatus')?.textContent || '';\n      return ['OK', '注意', 'NG'].includes(text);\n    }, { timeout: 60000 });\n\n    const result = await page.evaluate(() => {\n      const rows = Array.from(\n        document.querySelectorAll('#checkList .check')\n      ).map(row => ({\n        label:\n          row.querySelector('.check-title')?.textContent?.trim() || '',\n        message:\n          row.querySelector('.check-meta')?.textContent?.trim() || '',\n        status:\n          row.querySelector('.pill')?.textContent?.trim() || ''\n      }));\n\n      return {\n        overall:\n          document.getElementById('overallStatus')?.textContent?.trim(),\n        ok:\n          document.getElementById('okCount')?.textContent?.trim(),\n        attention:\n          document.getElementById('attentionCount')?.textContent?.trim(),\n        ng:\n          document.getElementById('ngCount')?.textContent?.trim(),\n\
        \        duplicateGuard:\n          rows.find(row =>\n            row.label === '追客・提案の二重操作防止'\n          ),\n        memberSecurity:\n          rows.find(row =>\n            row.label === '会員セッション保護'\n          )\n      };\n    });\n\n    for (const key of ['duplicateGuard', 'memberSecurity']) {\n      const row = result[key];\n      if (!row) throw new Error(`${key} row was not found.`);\n      if (row.status === 'NG') {\n        throw new Error(\n          `${key} remains false NG: ${JSON.stringify(row)}`\n        );\n      }\n      if (!['OK', '注意'].includes(row.status)) {\n        throw new Error(\n          `${key} has unexpected status: ${JSON.stringify(row)}`\n        );\n      }\n    }\n\n    await page.screenshot({\n      path: '/tmp/system-check-false-ng-r1/system-check-after.png',\n      fullPage: true\n    });\n\n    fs.writeFileSync(\n      '/tmp/system-check-false-ng-r1/result.json',\n      JSON.stringify(result, null, 2)\n    );\n\n    console.log(JSON.stringify(result,\
        \ null, 2));\n  } finally {\n    await browser.close();\n  }\n})().catch(error => {\n  console.error(error);\n  process.exit(1);\n});\nJS"
    - name: Upload corrected system-check evidence
      uses: actions/upload-artifact@v4
      with:
        name: estate-system-check-false-ng-r1
        path: /tmp/system-check-false-ng-r1
        retention-days: 30
    - name: Record completed hotfix
      shell: bash
      run: "set -Eeuo pipefail\ncompleted_at=\"$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%:z')\"\n\ncp   /tmp/system-check-false-ng-r1/result.json   dpro-next/estate-system-check-false-ng-result.json\n\ncat > dpro-next/estate-hotfix-system-check-false-ng.yml <<EOF\nsystem: DPRO 不動産・賃貸内見 LINE\nhotfix: ESTATE-NEXT-10-SYSTEM-CHECK-FALSE-NG-R1\nstatus: COMPLETE\ncompleted_at_jst: \"$completed_at\"\ncause:\n  api_mode: write_test_0\n  omitted_followup_test_object: true\n  omitted_member_security_test_object: true\n  old_ui_treated_empty_object_as_ng: true\ncorrection:\n  unexecuted_followup_write_test: ATTENTION\n  unexecuted_member_session_write_test: ATTENTION\n  executed_pass_test: OK\n  executed_fail_test: NG\napplication_data_changed: false\nworker_changed: false\nsupabase_changed: false\napi_changed: false\nexisting_features_preserved: true\nEOF\n\npython3 - <<'PY'\nfrom pathlib import Path\n\npath = Path('dpro-next/estate-progress.yml')\ntext = path.read_text(encoding='utf-8')\n\nrequired\
        \ = [\n    'current_step: ESTATE-NEXT-COMPLETE',\n    'next_step: NONE',\n    'complete: true',\n]\nmissing = [item for item in required if item not in text]\nif missing:\n    raise SystemExit(f'ERROR: final completion ledger changed: {missing}')\n\nupdates = {\n    'post_complete_system_check_hotfix':\n        'ESTATE-NEXT-10-SYSTEM-CHECK-FALSE-NG-R1',\n    'system_check_false_ng':\n        'CORRECTED',\n    'read_only_write_tests':\n        'ATTENTION_NOT_NG',\n}\n\nlines = text.rstrip().splitlines()\npositions = {\n    line.split(':', 1)[0].strip(): index\n    for index, line in enumerate(lines)\n    if ':' in line\n}\n\nfor key, value in updates.items():\n    line = f'{key}: {value}'\n    if key in positions:\n        lines[positions[key]] = line\n    else:\n        lines.append(line)\n\npath.write_text('\\n'.join(lines) + '\\n', encoding='utf-8')\nPY\n\ngit add   dpro-next/estate-progress.yml   dpro-next/estate-hotfix-system-check-false-ng.yml   dpro-next/estate-system-check-false-ng-result.json\n\
        \ngit commit -m 'Record ESTATE system-check false NG correction'\ngit push origin \"$TARGET_BRANCH\""
    - name: Delete completed workflow
      shell: bash
      run: "set -Eeuo pipefail\nrm -f \"$WORKFLOW_PATH\"\ngit add -A \"$WORKFLOW_PATH\"\nif ! git diff --cached --quiet; then\n  git commit -m 'Remove completed ESTATE system-check hotfix workflow'\n  git push origin \"$TARGET_BRANCH\"\nfi"
    - name: Publish completion summary
      shell: bash
      run: 'cat >> "$GITHUB_STEP_SUMMARY" <<''EOF''

        # ESTATE SYSTEM-CHECK FALSE NG R1 COMPLETE


        | 項目 | 結果 |

        |---|---|

        | 原因 | write_test=0で検査結果が空 |

        | 旧表示 | 空オブジェクトをNG判定 |

        | 新表示 | 未実施は注意 |

        | 実施済みPASS | OK |

        | 実施済みFAIL | NG |

        | Worker変更 | なし |

        | Supabase変更 | なし |

        | データ変更 | なし |

        | 完成台帳 | ESTATE-NEXT-COMPLETE維持 |


        確認画面:

        https://dpromstk2000-lab.github.io/dpro-estate-line-liff/system-check.html?demo=1&v=false-ng-r1

        EOF'
