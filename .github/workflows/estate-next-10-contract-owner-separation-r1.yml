name: DPRO ESTATE NEXT-10 Contract Owner Separation R1

'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/estate-next-10-contract-owner-separation-r1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dpro-estate-next-10-contract-owner-separation-r1
  cancel-in-progress: false

jobs:
  contract-owner-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: main
      WORKFLOW_PATH: .github/workflows/estate-next-10-contract-owner-separation-r1.yml
      PAGE_BASE: https://dpromstk2000-lab.github.io/dpro-estate-line-liff
      LEGACY_API: https://dpro-estate-line-api.dpromstk2000.workers.dev
      DEMO_SHOP_CODE: dpro_estate_demo
      BACKUP_TAG: dpro-estate-next-10-contract-owner-separation-before-20260725

    steps:
      - name: Checkout completed repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify completed system and protect current version
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s dpro-next/estate-progress.yml
          test "$(awk -F': ' '/^current_step:/{print $2;exit}' dpro-next/estate-progress.yml)" = 'ESTATE-NEXT-COMPLETE'
          test "$(awk -F': ' '/^complete:/{print $2;exit}' dpro-next/estate-progress.yml)" = 'true'
          test -s owner-settings.html
          test -s config.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git rev-parse "$BACKUP_TAG^{commit}" >/dev/null 2>&1; then
            tag_commit="$(git rev-parse "$BACKUP_TAG^{commit}")"
            if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
              echo 'ERROR: existing contract-owner backup tag is not an ancestor of main.'
              exit 1
            fi
            echo "Reusing backup tag: $BACKUP_TAG -> $tag_commit"
          else
            base_commit="$(git rev-parse HEAD^)"
            git tag -a "$BACKUP_TAG" "$base_commit" -m 'DPRO ESTATE completed version before contract owner separation'
            git push origin "$BACKUP_TAG"
          fi

      - name: Guard exact current settings structure
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY_GUARD'
          from pathlib import Path

          settings = Path('owner-settings.html').read_text(encoding='utf-8')
          config = Path('config.js').read_text(encoding='utf-8')

          required_settings = [
              'data-settings-button="system"',
              'data-settings-panel="system"',
              '営業前デモ準備',
              '管理コード変更',
              'system-checkを開く',
              'async function prepareDemo()',
              "await api('/api/admin/demo/prepare'",
          ]
          required_config = [
              "shopCode: 'dpro_estate_demo'",
              'demo: {',
              "adminCode: '1234'",
          ]

          missing = [
              item for item in required_settings
              if item not in settings
          ] + [
              item for item in required_config
              if item not in config
          ]
          if missing:
              raise SystemExit(
                  f'ERROR: current settings/config structure changed: {missing}'
              )

          if 'ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R1' in settings:
              raise SystemExit('ERROR: contract owner separation R1 is already installed.')

          print('Current mixed demo/contract settings structure confirmed.')
          PY_GUARD

      - name: Install deployment mode and contract owner separation
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY_PATCH'
          from pathlib import Path

          config_path = Path('config.js')
          config = config_path.read_text(encoding='utf-8')

          old_shop = "    shopCode: 'dpro_estate_demo',"
          new_shop = (
              "    deploymentMode: window.DPRO_ESTATE_DEPLOYMENT_MODE || 'demo',\n"
              "    shopCode: window.DPRO_ESTATE_SHOP_CODE || 'dpro_estate_demo',"
          )
          if old_shop not in config:
              raise SystemExit('ERROR: config shopCode insertion point was not found.')
          config = config.replace(old_shop, new_shop, 1)

          old_demo = """    demo: {
                queryKey: 'demo',
                queryValue: '1',
                adminCode: '1234'
              }"""
          new_demo = """    demo: {
                queryKey: 'demo',
                queryValue: '1',
                shopCode: 'dpro_estate_demo',
                adminCode: '1234'
              }"""
          if old_demo not in config:
              raise SystemExit('ERROR: config demo block was not found.')
          config = config.replace(old_demo, new_demo, 1)
          config_path.write_text(config, encoding='utf-8')

          settings_path = Path('owner-settings.html')
          text = settings_path.read_text(encoding='utf-8')

          nav_old = (
              '<button class="nav-btn" data-settings-button="system" '
              'onclick="openSettingsPanel(\'system\')">デモ・システム</button>'
          )
          nav_new = """<button class="nav-btn" data-settings-button="security" onclick="openSettingsPanel('security')">管理・セキュリティ</button>
                <button class="nav-btn hidden" id="demoSystemNav" data-demo-only data-settings-button="demo" onclick="openSettingsPanel('demo')">デモ・保守</button>"""
          if nav_old not in text:
              raise SystemExit('ERROR: old demo navigation button was not found.')
          text = text.replace(nav_old, nav_new, 1)

          panel_start = text.find(
              '<section class="settings-panel" data-settings-panel="system">'
          )
          panel_end = text.find('    </main>', panel_start)
          if panel_start < 0 or panel_end < 0:
              raise SystemExit('ERROR: old system panel range was not found.')

          replacement_panels = """<section class="settings-panel" data-settings-panel="security">
                  <section class="card">
          <div class="card-head"><div><h2 class="card-title">管理・セキュリティ</h2><p class="card-sub">契約オーナーが利用する管理コードと端末保存の設定です。</p></div><span class="pill">店舗管理</span></div>
          <div class="card-body">
            <div class="demo-card">
              <h3>管理コード変更</h3><p>本番導入時に変更してください。保存後、この端末の保存値も更新されます。</p>
              <div class="field" style="margin-top:10px"><label for="newAdminCode">新しい管理コード</label><input id="newAdminCode" type="password" autocomplete="new-password" placeholder="変更しない場合は空欄"></div>
              <div class="actions"><button class="btn" onclick="saveBasic()">管理コードを変更</button><button class="btn light" onclick="clearSavedAdminCode()">この端末から保存値を削除</button></div>
            </div>
            <div class="notice" style="margin-top:14px">営業前デモ準備・system-check・画面URLなどのDPRO保守機能は、契約店舗では表示されません。</div>
          </div>
                  </section>
                </section>

                <section class="settings-panel hidden" data-demo-only data-settings-panel="demo">
                  <section class="card">
          <div class="card-head"><div><h2 class="card-title">デモ・保守</h2><p class="card-sub">DPROの営業デモ・保守確認専用です。契約店舗では使用できません。</p></div><span class="pill warn">DPRO専用</span></div>
          <div class="card-body">
            <div class="notice warn">この画面は、demo=1・デモ店舗コード・デモ配置モードの3条件が一致した場合だけ表示されます。</div>
            <div class="demo-grid">
              <div class="demo-card">
                <h3>営業前デモ準備</h3><p>デモ予約・顧客・追客を初期状態へ戻します。契約店舗では実行できません。</p>
                <div class="actions"><button class="btn warn" id="demoPrepareBtn" onclick="prepareDemo()">営業前デモ準備</button></div>
              </div>
              <div class="demo-card"><h3>システム確認</h3><p>APIの管理コードをURLへ付けず、DPRO保守時に確認します。</p><div class="actions"><a class="btn secondary" id="systemCheckLink" href="system-check.html" target="_blank" rel="noopener">system-checkを開く</a></div></div>
            </div>
            <div class="demo-card" style="margin-top:14px"><h3>画面URL</h3><p>DPROの営業・保守確認に必要な画面だけを表示します。</p><div class="url-list">
              <div class="url-row"><strong>お客様画面</strong><code id="urlIndex"></code><button class="btn light" onclick="copyElementText('urlIndex')">コピー</button></div>
              <div class="url-row"><strong>PC管理画面</strong><code id="urlOwner"></code><button class="btn light" onclick="copyElementText('urlOwner')">コピー</button></div>
              <div class="url-row"><strong>店舗設定</strong><code id="urlSettings"></code><button class="btn light" onclick="copyElementText('urlSettings')">コピー</button></div>
            </div></div>
          </div>
                  </section>
                </section>
          """

          text = text[:panel_start] + replacement_panels + text[panel_end:]

          fallback_old = (
              "shopCode:'dpro_estate_demo',storage:{adminCode:"
              "'dpro_estate_admin_code',settingsPanel:"
              "'dpro_estate_settings_panel'},demo:{queryKey:'demo',"
              "queryValue:'1',adminCode:'1234'}"
          )
          fallback_new = (
              "deploymentMode:'demo',shopCode:'dpro_estate_demo',"
              "storage:{adminCode:'dpro_estate_admin_code',settingsPanel:"
              "'dpro_estate_settings_panel'},demo:{queryKey:'demo',"
              "queryValue:'1',shopCode:'dpro_estate_demo',adminCode:'1234'}"
          )
          if fallback_old not in text:
              raise SystemExit('ERROR: owner settings fallback config was not found.')
          text = text.replace(fallback_old, fallback_new, 1)

          old_state = (
              "const state={adminCode:'',authenticated:false,shop:null,"
              "areas:[],templates:[],selectedTemplateKey:'',loading:false};"
          )
          new_state = (
              "const state={adminCode:'',authenticated:false,shop:null,"
              "areas:[],templates:[],selectedTemplateKey:'',loading:false,"
              "demoEnvironment:false};"
          )
          if old_state not in text:
              raise SystemExit('ERROR: owner settings state declaration was not found.')
          text = text.replace(old_state, new_state, 1)

          old_meta = """      templates:['LINE文面','送信前確認用の文面テンプレートを編集します。'],
                system:['デモ・システム','デモ準備・管理コード・確認画面を管理します。']"""
          new_meta = """      templates:['LINE文面','送信前確認用の文面テンプレートを編集します。'],
                security:['管理・セキュリティ','管理コードと端末保存を管理します。'],
                demo:['デモ・保守','DPROの営業デモ・保守確認専用です。']"""
          if old_meta not in text:
              raise SystemExit('ERROR: settings panel metadata was not found.')
          text = text.replace(old_meta, new_meta, 1)

          old_dom = """    document.addEventListener('DOMContentLoaded',async()=>{
                setToday();setPageLinks();renderHolidayChecks([]);
                const saved=localStorage.getItem(CONFIG.storage.adminCode)||'';const demo=new URLSearchParams(location.search).get(CONFIG.demo.queryKey)===CONFIG.demo.queryValue;
                state.adminCode=saved||(demo?CONFIG.demo.adminCode:'');$('adminCodeInput').value=state.adminCode;
                const panel=localStorage.getItem(CONFIG.storage.settingsPanel)||'basic';openSettingsPanel(PANEL_META[panel]?panel:'basic',false);
                if(state.adminCode)await authenticate(true);
              });"""
          new_dom = """    document.addEventListener('DOMContentLoaded',async()=>{
                state.demoEnvironment=isDemoEnvironment();applyAccessMode();
                setToday();setPageLinks();renderHolidayChecks([]);
                const saved=localStorage.getItem(CONFIG.storage.adminCode)||'';
                state.adminCode=saved||(state.demoEnvironment?CONFIG.demo.adminCode:'');$('adminCodeInput').value=state.adminCode;
                let panel=localStorage.getItem(CONFIG.storage.settingsPanel)||'basic';
                if(panel==='demo'&&!state.demoEnvironment)panel='security';
                openSettingsPanel(PANEL_META[panel]?panel:'basic',false);
                if(state.adminCode)await authenticate(true);
              });"""
          if old_dom not in text:
              raise SystemExit('ERROR: DOMContentLoaded block was not found.')
          text = text.replace(old_dom, new_dom, 1)

          helper_anchor = "    function setToday(){"
          helpers = """    function isDemoEnvironment(){
                const params=new URLSearchParams(location.search);
                const requestedDemo=params.get(CONFIG.demo.queryKey)===CONFIG.demo.queryValue;
                const demoShopCode=CONFIG.demo.shopCode||'dpro_estate_demo';
                const deploymentMode=String(CONFIG.deploymentMode||'demo').toLowerCase();
                return requestedDemo&&CONFIG.shopCode===demoShopCode&&deploymentMode==='demo';
              }
              function applyAccessMode(){
                document.querySelectorAll('[data-demo-only]').forEach(el=>el.classList.toggle('hidden',!state.demoEnvironment));
                document.documentElement.dataset.deploymentMode=state.demoEnvironment?'demo':'contract';
              }
          """
          if helper_anchor not in text:
              raise SystemExit('ERROR: helper insertion anchor was not found.')
          text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          old_links = """    function setPageLinks(){const v='estate-next-2';$('ownerLink').href=`${CONFIG.pageBase}/owner.html?v=${v}`;$('ipadLink').href=`${CONFIG.pageBase}/owner-ipad.html?v=${v}`;$('systemCheckLink').href=`${CONFIG.pageBase}/system-check.html?v=${v}`;$('urlIndex').textContent=`${CONFIG.pageBase}/index.html`;$('urlOwner').textContent=`${CONFIG.pageBase}/owner.html?v=${v}`;$('urlSettings').textContent=`${CONFIG.pageBase}/owner-settings.html?v=${v}`;}"""
          new_links = """    function setPageLinks(){const v='estate-next-10-contract-owner-separation-r1';$('ownerLink').href=`${CONFIG.pageBase}/owner.html?v=${v}`;$('ipadLink').href=`${CONFIG.pageBase}/owner-ipad.html?v=${v}`;if($('systemCheckLink'))$('systemCheckLink').href=`${CONFIG.pageBase}/system-check.html?demo=1&v=${v}`;if($('urlIndex'))$('urlIndex').textContent=`${CONFIG.pageBase}/index.html`;if($('urlOwner'))$('urlOwner').textContent=`${CONFIG.pageBase}/owner.html?v=${v}`;if($('urlSettings'))$('urlSettings').textContent=`${CONFIG.pageBase}/owner-settings.html?demo=1&v=${v}`;}"""
          if old_links not in text:
              raise SystemExit('ERROR: page link function was not found.')
          text = text.replace(old_links, new_links, 1)

          old_open = """    function openSettingsPanel(name,render=true){document.querySelectorAll('[data-settings-panel]').forEach(el=>el.classList.toggle('active',el.dataset.settingsPanel===name));document.querySelectorAll('[data-settings-button]').forEach(el=>el.classList.toggle('active',el.dataset.settingsButton===name));$('currentTitle').textContent=PANEL_META[name][0];$('currentDescription').textContent=PANEL_META[name][1];localStorage.setItem(CONFIG.storage.settingsPanel,name);closeSidebar();if(render&&state.authenticated){if(name==='areas')renderAreas();if(name==='templates')renderTemplates();}}"""
          new_open = """    function openSettingsPanel(name,render=true){if(name==='demo'&&!state.demoEnvironment){toast('この操作はDPROデモ環境専用です。',true);name='security';}const meta=PANEL_META[name]||PANEL_META.basic;document.querySelectorAll('[data-settings-panel]').forEach(el=>el.classList.toggle('active',el.dataset.settingsPanel===name));document.querySelectorAll('[data-settings-button]').forEach(el=>el.classList.toggle('active',el.dataset.settingsButton===name));$('currentTitle').textContent=meta[0];$('currentDescription').textContent=meta[1];localStorage.setItem(CONFIG.storage.settingsPanel,name);closeSidebar();if(render&&state.authenticated){if(name==='areas')renderAreas();if(name==='templates')renderTemplates();}}"""
          if old_open not in text:
              raise SystemExit('ERROR: settings panel function was not found.')
          text = text.replace(old_open, new_open, 1)

          old_api = """    async function api(path,options={}){
                const method=options.method||'GET',url=new URL(CONFIG.apiBase+path);url.searchParams.set('shop_code',CONFIG.shopCode);if(method==='GET')url.searchParams.set('admin_code',state.adminCode);"""
          new_api = """    async function api(path,options={}){
                if(path==='/api/admin/demo/prepare'&&!state.demoEnvironment)throw new Error('契約店舗ではデモ準備を実行できません。');
                const method=options.method||'GET',url=new URL(CONFIG.apiBase+path);url.searchParams.set('shop_code',CONFIG.shopCode);if(method==='GET')url.searchParams.set('admin_code',state.adminCode);"""
          if old_api not in text:
              raise SystemExit('ERROR: API function insertion point was not found.')
          text = text.replace(old_api, new_api, 1)

          old_prepare = """    async function prepareDemo(){if(!state.authenticated){toast('先に管理コードを確認してください。',true);return;}if(!confirm('営業前デモデータを再準備します。現在のデモ状態が初期化されます。実行しますか？'))return;try{setLoading(true);const data=await api('/api/admin/demo/prepare',{method:'POST',body:{}});toast(data.message||'営業前デモ準備が完了しました。');await loadAll(true);}catch(error){toast(error.message,true);}finally{setLoading(false);}}"""
          new_prepare = """    async function prepareDemo(){if(!state.demoEnvironment){toast('契約店舗ではデモ準備を実行できません。',true);return;}if(!state.authenticated){toast('先に管理コードを確認してください。',true);return;}if(!confirm('営業前デモデータを再準備します。現在のデモ状態が初期化されます。実行しますか？'))return;try{setLoading(true);const data=await api('/api/admin/demo/prepare',{method:'POST',body:{demo_mode:true}});toast(data.message||'営業前デモ準備が完了しました。');await loadAll(true);}catch(error){toast(error.message,true);}finally{setLoading(false);}}"""
          if old_prepare not in text:
              raise SystemExit('ERROR: prepareDemo function was not found.')
          text = text.replace(old_prepare, new_prepare, 1)

          text = text.replace(
              '<!-- DPRO ESTATE NEXT-2 / owner-settings.html -->',
              '<!-- ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R1 / owner-settings.html -->',
              1
          )
          text = text.replace(
              '<script src="config.js?v=estate-next-2"></script>',
              '<script src="config.js?v=estate-next-10-contract-owner-separation-r1"></script>',
              1
          )

          settings_path.write_text(text, encoding='utf-8')
          print('Contract owner and demo maintenance settings separated.')
          PY_PATCH

      - name: Add contract deployment policy and access matrix
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > dpro-next/estate-contract-owner-access.yml <<'EOF_POLICY'
          system: DPRO 不動産・賃貸内見 LINE
          policy: CONTRACT-OWNER-SEPARATION-R1
          demo_visibility_condition:
            query_demo_equals_1: true
            shop_code_equals_dpro_estate_demo: true
            deployment_mode_equals_demo: true
            all_conditions_required: true
          contract_owner_visible:
            - 店舗基本情報
            - 予約・営業時間
            - 対応エリア
            - LINE文面
            - 管理・セキュリティ
            - 管理コード変更
            - 端末保存管理コード削除
            - PC管理画面
            - iPad・スタッフ画面
          contract_owner_hidden:
            - 営業前デモ準備
            - デモデータ初期化
            - system-check
            - 画面URL一覧
            - DPRO保守操作
          client_direct_call_guard: true
          unknown_shop_server_probe_required: true
          legacy_worker_source_in_repository: false
          valid_contract_shop_server_guard: ATTENTION_SOURCE_UNAVAILABLE
          EOF_POLICY

      - name: Validate HTML JavaScript IDs and access rules
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -q 'ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R1' owner-settings.html
          grep -q 'data-settings-button="security"' owner-settings.html
          grep -q 'data-settings-button="demo"' owner-settings.html
          grep -q 'data-settings-panel="security"' owner-settings.html
          grep -q 'data-settings-panel="demo"' owner-settings.html
          grep -q "deploymentMode: window.DPRO_ESTATE_DEPLOYMENT_MODE || 'demo'" config.js
          grep -q "shopCode: window.DPRO_ESTATE_SHOP_CODE || 'dpro_estate_demo'" config.js
          grep -q "shopCode: 'dpro_estate_demo'" config.js

          python3 - <<'PY_VALIDATE'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class SettingsParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.inline_scripts = []
                  self.in_script = False
                  self.buffer = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'script' and 'src' not in attrs:
                      self.in_script = True
                      self.buffer = []

              def handle_data(self, data):
                  if self.in_script:
                      self.buffer.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_script:
                      self.inline_scripts.append(''.join(self.buffer))
                      self.in_script = False
                      self.buffer = []

          text = Path('owner-settings.html').read_text(encoding='utf-8')
          parser = SettingsParser()
          parser.feed(text)

          duplicates = sorted({
              item for item in parser.ids
              if parser.ids.count(item) > 1
          })
          if duplicates:
              raise SystemExit(f'ERROR: duplicate owner-settings IDs: {duplicates}')

          combined = '\n'.join(parser.inline_scripts).strip()
          with tempfile.NamedTemporaryFile(
              'w',
              suffix='.js',
              encoding='utf-8',
              delete=False
          ) as handle:
              handle.write(combined)
              js_path = handle.name

          result = subprocess.run(
              ['node', '--check', js_path],
              capture_output=True,
              text=True
          )
          Path(js_path).unlink(missing_ok=True)
          if result.returncode:
              raise SystemExit(result.stderr)

          required = [
              "return requestedDemo&&CONFIG.shopCode===demoShopCode&&deploymentMode==='demo'",
              "if(name==='demo'&&!state.demoEnvironment)",
              "if(path==='/api/admin/demo/prepare'&&!state.demoEnvironment)",
              "if(!state.demoEnvironment){toast('契約店舗ではデモ準備を実行できません。'",
              '管理・セキュリティ',
              'DPRO専用',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: separation rules missing: {missing}')

          if 'data-settings-button="system"' in text:
              raise SystemExit('ERROR: old mixed system navigation remains.')
          if 'data-settings-panel="system"' in text:
              raise SystemExit('ERROR: old mixed system panel remains.')

          print('owner-settings HTML IDs: PASS')
          print('owner-settings JavaScript syntax: PASS')
          print('contract/demo access rules: PASS')
          PY_VALIDATE

          node --check config.js

      - name: Commit contract owner separation
        shell: bash
        run: |
          set -Eeuo pipefail

          git add \
            owner-settings.html \
            config.js \
            dpro-next/estate-contract-owner-access.yml

          if git diff --cached --quiet; then
            echo 'ERROR: contract owner separation did not change files.'
            exit 1
          fi

          git commit -m 'Separate DPRO ESTATE contract owner and demo operations'
          git push origin "$TARGET_BRANCH"

      - name: Wait for GitHub Pages publication
        shell: bash
        run: |
          set -Eeuo pipefail

          published=0
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error \
              "$PAGE_BASE/owner-settings.html?demo=1&v=contract-owner-r1-${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/settings-live.html || true

            if grep -q 'ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R1' /tmp/settings-live.html 2>/dev/null; then
              published=1
              break
            fi
            sleep 10
          done

          if [ "$published" != '1' ]; then
            echo 'ERROR: updated owner-settings.html was not published in time.'
            exit 1
          fi

          grep -q '管理・セキュリティ' /tmp/settings-live.html
          grep -q 'DPRO専用' /tmp/settings-live.html
          echo 'Published contract owner separation confirmed.'

      - name: Run demo and contract browser access tests
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install --no-save --no-package-lock playwright-core@1.52.0 >/dev/null 2>&1

          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser_path" ]; then
            echo 'ERROR: a system Chromium browser was not found.'
            exit 1
          fi

          mkdir -p /tmp/contract-owner-separation

          BROWSER_PATH="$browser_path" PAGE_BASE="$PAGE_BASE" node <<'JS_BROWSER'
          const { chromium } = require('playwright-core');
          const fs = require('fs');

          const executablePath = process.env.BROWSER_PATH;
          const pageBase = process.env.PAGE_BASE;

          async function mockSettings(page) {
            await page.route('**/api/admin/settings**', async route => {
              const method = route.request().method();
              if (method === 'GET') {
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify({
                    ok: true,
                    shop: {
                      shop_name: '契約店舗テスト',
                      business_start_time: '10:00',
                      business_end_time: '18:00',
                      slot_minutes: 30,
                      booking_days_ahead: 60,
                      regular_holidays: [],
                      max_viewings_per_day: 8,
                      max_reservations_per_slot: 1
                    },
                    areas: [],
                    message_templates: []
                  })
                });
              } else {
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify({ ok: true })
                });
              }
            });
          }

          async function inspectDemo(browser) {
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 }
            });
            await mockSettings(page);

            await page.goto(
              `${pageBase}/owner-settings.html?demo=1&v=contract-owner-r1-${Date.now()}`,
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            const result = await page.evaluate(() => ({
              mode: document.documentElement.dataset.deploymentMode,
              demoNavHidden: document.getElementById('demoSystemNav').classList.contains('hidden'),
              securityExists: Boolean(document.querySelector('[data-settings-button="security"]')),
              demoPanelHidden: document.querySelector('[data-settings-panel="demo"]').classList.contains('hidden')
            }));

            if (result.mode !== 'demo') {
              throw new Error(`Demo mode was not detected: ${JSON.stringify(result)}`);
            }
            if (result.demoNavHidden || result.demoPanelHidden || !result.securityExists) {
              throw new Error(`Demo controls were not correctly available: ${JSON.stringify(result)}`);
            }

            await page.evaluate(() => window.openSettingsPanel('demo'));
            if (!(await page.locator('[data-settings-panel="demo"]').isVisible())) {
              throw new Error('Demo panel did not open in the demo environment.');
            }

            await page.screenshot({
              path: '/tmp/contract-owner-separation/demo-settings.png',
              fullPage: true
            });
            await page.close();
            return result;
          }

          async function inspectContract(browser, width, height, label) {
            const page = await browser.newPage({
              viewport: { width, height }
            });

            await page.addInitScript(() => {
              window.DPRO_ESTATE_DEPLOYMENT_MODE = 'contract';
              window.DPRO_ESTATE_SHOP_CODE = 'dpro_estate_contract_test';
              window.confirm = () => true;
            });

            await mockSettings(page);

            let demoPrepareRequests = 0;
            await page.route('**/api/admin/demo/prepare**', async route => {
              demoPrepareRequests += 1;
              await route.fulfill({
                status: 500,
                contentType: 'application/json',
                body: JSON.stringify({ ok: false })
              });
            });

            await page.goto(
              `${pageBase}/owner-settings.html?demo=1&v=contract-owner-r1-${Date.now()}`,
              { waitUntil: 'networkidle', timeout: 60000 }
            );

            const initial = await page.evaluate(() => ({
              mode: document.documentElement.dataset.deploymentMode,
              demoNavHidden: document.getElementById('demoSystemNav').classList.contains('hidden'),
              demoPanelHidden: document.querySelector('[data-settings-panel="demo"]').classList.contains('hidden'),
              securityHidden: document.querySelector('[data-settings-panel="security"]').classList.contains('hidden'),
              demoEnvironment: window.state?.demoEnvironment
            }));

            if (initial.mode !== 'contract') {
              throw new Error(`${label}: contract mode was not detected: ${JSON.stringify(initial)}`);
            }
            if (!initial.demoNavHidden || !initial.demoPanelHidden) {
              throw new Error(`${label}: demo controls were visible: ${JSON.stringify(initial)}`);
            }

            await page.evaluate(() => window.openSettingsPanel('demo'));
            const activePanel = await page.evaluate(() =>
              document.querySelector('.settings-panel.active')?.dataset.settingsPanel
            );
            if (activePanel === 'demo') {
              throw new Error(`${label}: direct demo panel opening was not blocked.`);
            }

            await page.evaluate(async () => {
              window.state.authenticated = true;
              await window.prepareDemo();
            });

            if (demoPrepareRequests !== 0) {
              throw new Error(`${label}: blocked demo operation still made an API request.`);
            }

            await page.evaluate(() => window.openSettingsPanel('security'));
            if (!(await page.locator('[data-settings-panel="security"]').isVisible())) {
              throw new Error(`${label}: management security panel is not available.`);
            }

            const overflow = await page.evaluate(() =>
              Math.max(0, document.documentElement.scrollWidth - window.innerWidth)
            );
            if (overflow > 2) {
              throw new Error(`${label}: horizontal overflow ${overflow}px`);
            }

            await page.screenshot({
              path: `/tmp/contract-owner-separation/${label}.png`,
              fullPage: true
            });

            await page.close();
            return {
              ...initial,
              activePanelAfterBlockedOpen: activePanel,
              demoPrepareRequests,
              horizontalOverflow: overflow
            };
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath,
              args: ['--no-sandbox']
            });

            try {
              const result = {
                demo: await inspectDemo(browser),
                contractDesktop: await inspectContract(
                  browser, 1440, 900, 'contract-desktop'
                ),
                contractMobile: await inspectContract(
                  browser, 390, 844, 'contract-mobile'
                )
              };

              fs.writeFileSync(
                '/tmp/contract-owner-separation/browser-result.json',
                JSON.stringify(result, null, 2)
              );
              console.log(JSON.stringify(result, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS_BROWSER

      - name: Probe legacy demo endpoint with unknown contract shop
        shell: bash
        run: |
          set -Eeuo pipefail

          probe_shop="contract_guard_probe_${GITHUB_RUN_ID}"
          response_file=/tmp/contract-owner-separation/server-probe.json

          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-Admin-Code: 1234' \
            --header 'X-DPRO-Admin-Code: 1234' \
            --data "{\"shop_code\":\"$probe_shop\",\"admin_code\":\"1234\",\"demo_mode\":true}" \
            "$LEGACY_API/api/admin/demo/prepare" || true)"

          PROBE_HTTP="$http_status" PROBE_FILE="$response_file" \
          python3 - <<'PY_PROBE'
          import json
          import os
          from pathlib import Path

          status = int(os.environ.get('PROBE_HTTP') or 0)
          path = Path(os.environ['PROBE_FILE'])
          raw = path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''

          try:
              data = json.loads(raw) if raw else {}
          except Exception:
              data = {'parse_error': True}

          accepted = (
              200 <= status < 300 and
              isinstance(data, dict) and
              data.get('ok') is True
          )
          if accepted:
              raise SystemExit(
                  'ERROR: unknown contract shop unexpectedly passed demo preparation.'
              )

          safe = {
              'http_status': status,
              'unknown_contract_shop_rejected': True,
              'response_ok': data.get('ok') if isinstance(data, dict) else None,
              'legacy_worker_source_in_repository': False,
              'valid_contract_shop_server_guard': 'ATTENTION_SOURCE_UNAVAILABLE'
          }
          path.write_text(
              json.dumps(safe, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(json.dumps(safe, ensure_ascii=False, indent=2))
          PY_PROBE

      - name: Upload separation visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: estate-contract-owner-separation-r1
          path: /tmp/contract-owner-separation
          retention-days: 30

      - name: Record completed-system access hotfix
        shell: bash
        run: |
          set -Eeuo pipefail

          completed_at="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%:z')"
          cp /tmp/contract-owner-separation/browser-result.json \
            dpro-next/estate-contract-owner-browser-result.json
          cp /tmp/contract-owner-separation/server-probe.json \
            dpro-next/estate-contract-owner-server-probe.json

          cat > dpro-next/estate-hotfix-contract-owner-separation.yml <<EOF_RECORD
          system: DPRO 不動産・賃貸内見 LINE
          hotfix: ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R1
          status: COMPLETE_WITH_SERVER_ATTENTION
          completed_at_jst: "$completed_at"
          demo_visibility_condition:
            query_demo_equals_1: PASS
            demo_shop_code_match: PASS
            deployment_mode_demo: PASS
            all_conditions_required: PASS
          contract_owner_demo_menu_hidden: PASS
          contract_owner_demo_panel_hidden: PASS
          contract_owner_direct_panel_open_blocked: PASS
          contract_owner_prepare_demo_client_blocked: PASS
          contract_owner_demo_api_request_count: 0
          contract_owner_security_panel_visible: PASS
          desktop_visual_check: PASS
          mobile_visual_check: PASS
          unknown_contract_shop_server_probe: PASS
          legacy_worker_source_in_repository: false
          valid_contract_shop_server_guard: ATTENTION_SOURCE_UNAVAILABLE
          worker_changed: false
          supabase_changed: false
          api_changed: false
          existing_features_preserved: true
          EOF_RECORD

          python3 - <<'PY_PROGRESS'
          from pathlib import Path

          path = Path('dpro-next/estate-progress.yml')
          text = path.read_text(encoding='utf-8')

          required = [
              'current_step: ESTATE-NEXT-COMPLETE',
              'next_step: NONE',
              'complete: true',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(
                  f'ERROR: final completion ledger changed unexpectedly: {missing}'
              )

          updates = {
              'post_complete_access_hotfix':
                  'ESTATE-NEXT-10-CONTRACT-OWNER-SEPARATION-R1',
              'contract_owner_demo_menu': 'HIDDEN',
              'contract_owner_demo_prepare': 'BLOCKED_CLIENT_SIDE',
              'contract_owner_security_panel': 'PASS',
              'demo_access_condition':
                  'DEMO_QUERY_AND_DEMO_SHOP_AND_DEMO_MODE',
              'demo_server_guard':
                  'ATTENTION_LEGACY_SOURCE_UNAVAILABLE',
          }

          lines = text.rstrip().splitlines()
          positions = {
              line.split(':', 1)[0].strip(): index
              for index, line in enumerate(lines)
              if ':' in line
          }

          for key, value in updates.items():
              line = f'{key}: {value}'
              if key in positions:
                  lines[positions[key]] = line
              else:
                  lines.append(line)

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY_PROGRESS

          git add \
            dpro-next/estate-progress.yml \
            dpro-next/estate-hotfix-contract-owner-separation.yml \
            dpro-next/estate-contract-owner-browser-result.json \
            dpro-next/estate-contract-owner-server-probe.json

          git commit -m 'Record DPRO ESTATE contract owner separation'
          git push origin "$TARGET_BRANCH"

      - name: Delete completed workflow
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$WORKFLOW_PATH"
          git add -A "$WORKFLOW_PATH"

          if ! git diff --cached --quiet; then
            git commit -m 'Remove completed DPRO ESTATE contract owner workflow'
            git push origin "$TARGET_BRANCH"
          fi

