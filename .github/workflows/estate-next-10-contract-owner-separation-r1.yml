        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF_SUMMARY'
          # DPRO ESTATE CONTRACT OWNER SEPARATION COMPLETE

          | 項目 | 結果 |
          |---|---|
          | 契約オーナー：店舗基本情報 | 表示 |
          | 契約オーナー：予約・営業時間 | 表示 |
          | 契約オーナー：対応エリア | 表示 |
          | 契約オーナー：LINE文面 | 表示 |
          | 契約オーナー：管理・セキュリティ | 表示 |
          | 契約オーナー：デモ・保守 | 非表示 |
          | 契約オーナー：営業前デモ準備 | 実行不可 |
          | JavaScript直接呼出し | API通信0件 |
          | デモ環境 | 従来どおり表示 |
          | Desktop | PASS |
          | Mobile | PASS |
          | 不明な契約店舗コードのサーバー試験 | 拒否 |
          | 既存Worker原本 | リポジトリになし・注意継続 |
          | 完成台帳 | ESTATE-NEXT-COMPLETEを維持 |

          デモ確認:
          https://dpromstk2000-lab.github.io/dpro-estate-line-liff/owner-settings.html?demo=1&v=contract-owner-r1

          通常URLではデモ・保守メニューは表示されません:
          https://dpromstk2000-lab.github.io/dpro-estate-line-liff/owner-settings.html?v=contract-owner-r1
          EOF_SUMMARY
